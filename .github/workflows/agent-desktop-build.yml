            test -f "$file" && test ! -L "$file"
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/agent-desktop-build.yml" \
              --source-ref refs/heads/master --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify downloaded signatures, notarization, hashes and profile
        run: nix develop --no-update-lock-file . -c ./scripts/verify-release.sh "$MAPLE_RELEASE_PROFILE" "../../artifacts"

  verify-linux:
    name: Verify downloaded Linux (${{ matrix.variant }})
    needs: [linux, attest-linux]
    if: ${{ always() && !cancelled() && needs.linux.result == 'success' && (github.event_name == 'pull_request' || (needs.attest-linux.result == 'success' && github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))) }}
    permissions:
      contents: read
      attestations: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name == 'pull_request' && '["dev"]' || '["dev","prod"]') }}
    env:
      MAPLE_RELEASE_PROFILE: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""

      - name: Verify pinned Nix runtime
        working-directory: .
        run: bash scripts/ci/verify-nix-runtime.sh
      - name: Download exact Agent packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: maple-agent-${{ matrix.variant }}-linux-x86_64-${{ github.run_id }}
          path: artifacts
      - name: Verify downloaded package provenance
        if: ${{ github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        working-directory: .
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            test -f "$file" && test ! -L "$file"
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/agent-desktop-build.yml" \
              --source-ref refs/heads/master --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build trusted installer archive scanner
        run: nix develop --no-update-lock-file . -c cargo build --locked -p maple-agent-updater --example validate-release-archive
      - name: Scan downloaded Linux bundle with installer parser
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then args=(--unsigned); fi
          nix develop --no-update-lock-file . -c ./scripts/verify-updater-archive.sh "../../artifacts" --profile "$MAPLE_RELEASE_PROFILE" --platform linux-x86_64 "${args[@]}"
      - name: Verify downloaded hashes and profile
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then args=(--unsigned); fi
          nix develop --no-update-lock-file . -c ./scripts/verify-release.sh "$MAPLE_RELEASE_PROFILE" "../../artifacts" "${args[@]}" --platform linux-x86_64
      - name: Smoke downloaded Linux bundle without Nix
        working-directory: .
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(artifacts/*-linux-x86_64.tar.gz)
          test "${#archives[@]}" -eq 1
          test -d /etc/ssl/certs
          docker run --rm --platform linux/amd64 --user 65534:65534 \
            --network none --read-only --tmpfs /tmp:exec,mode=1777 \
            --volume "$PWD/artifacts:/artifacts:ro" \
            --volume "$PWD/apps/maple-agent/scripts/smoke-linux-bundle-host.sh:/checks/smoke-linux-bundle-host.sh:ro" \
            --volume /etc/ssl/certs:/etc/ssl/certs:ro \
            ubuntu@sha256:f610ab94648195aa356059f5b41d6085c9d4d903c072430cdd1af7bdb646106b /bin/sh -ec '
              cd /tmp
              tar -xzpf /artifacts/*-linux-x86_64.tar.gz
              ./maple-agent*.app/AppRun --version >&2
              ./maple-agent*.app/AppRun --build-info
              MAPLE_AGENT_SMOKE_DIAGNOSTICS=1 /bin/sh /checks/smoke-linux-bundle-host.sh ./maple-agent*.app/AppRun >&2
            ' > "$RUNNER_TEMP/portable-build-info.json"
          python3 - "$MAPLE_RELEASE_PROFILE" "$RUNNER_TEMP/portable-build-info.json" artifacts/build-info.json <<'PY'
          import json
          import sys
          actual = json.load(open(sys.argv[2]))
          expected = json.load(open(sys.argv[3]))
          if actual != expected or actual.get("profile") != sys.argv[1]:
              raise SystemExit("portable Linux bundle build profile differs from verified package")
          print("Verified Agent launch and embedded profile without a Nix installation")
          PY
