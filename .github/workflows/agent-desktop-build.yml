name: Maple Agent Desktop Builds

on:
  push:
    branches: [master]
  pull_request:
    # Run unprivileged validation for stacked PRs as well as master targets.
  workflow_dispatch:

# Signing is confined to protected master jobs. PR packaging runs with a
# read-only token and no environment credentials, including fork PRs.
permissions:
  contents: read

concurrency:
  # PR updates replace their previews. Each master run keeps its own group,
  # so neither running nor pending packages are discarded by a later push.
  group: maple-agent-desktop-builds-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash
    working-directory: apps/maple-agent

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      agent: ${{ steps.classify.outputs.agent }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Select master packaging since last verified build
        id: master
        if: ${{ github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master' && github.event_name == 'push' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/agent_master_selection.py >> "$GITHUB_OUTPUT"
      - name: Select Agent packaging
        id: classify
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MASTER_AGENT: ${{ steps.master.outputs.agent }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            if [ "$GITHUB_EVENT_NAME" = push ] && [ "${MASTER_AGENT:-}" = false ]; then
              echo 'agent=false' >> "$GITHUB_OUTPUT"
            else
              echo 'agent=true' >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          paths="$(mktemp)"
          trap 'rm -f "$paths"' EXIT
          if ! git diff --no-renames --name-only -z "${BASE_SHA}...${HEAD_SHA}" > "$paths"; then
            echo 'agent=true' >> "$GITHUB_OUTPUT"
          elif ! python3 scripts/ci/agent_change_detection.py < "$paths" >> "$GITHUB_OUTPUT"; then
            echo 'agent=true' >> "$GITHUB_OUTPUT"
          fi

  macos-build:
    name: Build macOS binary (${{ matrix.variant }})
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.agent != 'false') && (github.event_name == 'pull_request' || (github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))) }}
    runs-on: blacksmith-6vcpu-macos-26
    permissions:
      contents: read
      actions: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name == 'pull_request' && '["dev"]' || '["dev","prod"]') }}
    env:
      MAPLE_RELEASE_PROFILE: ${{ matrix.variant }}
      DEPENDENCY_CACHE_JOB: Build macOS binary (${{ matrix.variant }})
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""

      - name: Verify pinned Nix runtime
        working-directory: .
        run: bash scripts/ci/verify-nix-runtime.sh
      - name: Select pinned Xcode
        working-directory: .
        run: python3 scripts/ci/select-xcode.py
      - name: Fingerprint the actual release environment
        id: environment
        run: nix develop --no-update-lock-file . -c python3 ../../scripts/ci/agent_cache_scope.py --profile release --output "$RUNNER_TEMP/agent-environment.json"
      - name: Restore validated master dependency archive
        id: dependency-archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ../../scripts/ci/agent_dependency_archive.py restore \
            --environment "$RUNNER_TEMP/agent-environment.json" --target "target" \
            --job-name "$DEPENDENCY_CACHE_JOB" --workflow agent-desktop-build.yml \
            --receipt "$RUNNER_TEMP/agent-dependency-receipt.json"

      - name: Cache Agent release dependencies
        id: rust-cache
        if: ${{ steps.dependency-archive.outputs.restored != 'true' }}
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: apps/maple-agent -> target
          add-rust-environment-hash-key: "true"
          key: maple-agent-release-v2-${{ matrix.variant }}-${{ steps.environment.outputs.compatibility }}
          cmd-format: python3 "${{ github.workspace }}/scripts/ci/agent_cache_command.py" {0}
          save-if: "false"
      - name: Check whether Cargo targets were restored
        id: restored-target
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          target = Path(os.environ["GITHUB_WORKSPACE"]) / "apps/maple-agent/target"
          present = any(
              any(fingerprint.iterdir()) and any(
                  output.is_file() and output.stat().st_size > 0
                  for pattern in ("*.rlib", "*.rmeta")
                  for output in (fingerprint.parent / "deps").glob(pattern)
              )
              for fingerprint in target.rglob(".fingerprint") if fingerprint.is_dir()
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"present={str(present).lower()}\n")
          PYTHON

      - name: Restore compatible legacy Cargo targets on a cache miss
        if: ${{ steps.dependency-archive.outputs.restored != 'true' && steps.restored-target.outputs.present != 'true' }}
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: apps/maple-agent -> target
          add-rust-environment-hash-key: "false"
          key: maple-agent-release-v2-${{ matrix.variant }}-${{ steps.environment.outputs.legacy_compatibility }}
          cmd-format: python3 "${{ github.workspace }}/scripts/ci/agent_cache_command.py" {0}
          save-if: "false"
      - name: Record the current release environment after restore
        run: |
          mkdir -p target/ci-metrics
          cp "$RUNNER_TEMP/agent-environment.json" target/ci-metrics/environment.json
      - name: Verify the canonical SDK and proxy dependency graph
        run: |
          metadata="$RUNNER_TEMP/agent-workspace-metadata.json"
          # shellcheck disable=SC2016 # The child shell expands its own positional argument.
          nix develop --no-update-lock-file . -c bash -c 'cargo metadata --locked --format-version 1 > "$1"' -- "$metadata"
          python3 ../../scripts/ci/verify-agent-rust-deps.py "$metadata"
          nix develop --no-update-lock-file . -c python3 scripts/verify-sqlcipher-build.py "$metadata"
      - name: Build optimized Agent with embedded profile
        run: nix develop --no-update-lock-file . -c python3 ../../scripts/ci/agent_measure.py --phase release-build --target target -- ./scripts/build-release.sh "$MAPLE_RELEASE_PROFILE"
      - name: Upload prebuilt Agent binary and notices
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maple-agent-${{ matrix.variant }}-macos-aarch64-prebuilt-${{ github.run_id }}
          overwrite: true
          path: |
            apps/maple-agent/target/release/maple-agent
            apps/maple-agent/target/third-party-notices
          if-no-files-found: error
          retention-days: 7

      - name: Prepare trusted dependency archive after validation
        id: dependency-seed
        if: ${{ success() && github.repository == 'MaplePrivacyLabs/Maple' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          python3 ../../scripts/ci/agent_dependency_archive.py pack \
            --environment "$RUNNER_TEMP/agent-environment.json" --metadata "$RUNNER_TEMP/agent-workspace-metadata.json" \
            --target "target" --job-name "$DEPENDENCY_CACHE_JOB" --workflow agent-desktop-build.yml \
            --output-dir "$RUNNER_TEMP/agent-dependency-seed" \
            --receipt "$RUNNER_TEMP/agent-dependency-receipt.json"

      - name: Upload durable dependency archive
        if: ${{ success() && github.repository == 'MaplePrivacyLabs/Maple' && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.dependency-seed.outputs.needs-upload == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.dependency-seed.outputs.artifact-name }}
          path: |
            ${{ runner.temp }}/agent-dependency-seed/manifest.json
            ${{ runner.temp }}/agent-dependency-seed/dependencies.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 3

      - name: Summarize release phase timings and target size
        if: always()
        run: python3 ../../scripts/ci/agent_measure.py --summarize target
      - name: Upload bounded release measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maple-agent-release-metrics-${{ matrix.variant }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/maple-agent/target/ci-metrics/
          if-no-files-found: warn
          retention-days: 7

  macos:
    name: Signed macOS (${{ matrix.variant }})
    needs: [changes, macos-build]
    if: ${{ always() && !cancelled() && needs.macos-build.result == 'success' && github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    environment: desktop-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [dev, prod]
    env:
      MAPLE_RELEASE_PROFILE: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""

      - name: Verify pinned Nix runtime
        working-directory: .
        run: bash scripts/ci/verify-nix-runtime.sh
      - name: Select pinned Xcode
        working-directory: .
        run: python3 scripts/ci/select-xcode.py
      - name: Download exact prebuilt Agent binary and notices
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: maple-agent-${{ matrix.variant }}-macos-aarch64-prebuilt-${{ github.run_id }}
          path: apps/maple-agent/target
      - name: Verify prebuilt profile and source before signing
        run: nix develop --no-update-lock-file . -c ./scripts/verify-prebuilt-release.sh "$MAPLE_RELEASE_PROFILE"
      - name: Build trusted installer archive scanner
        if: ${{ matrix.variant == 'prod' }}
        run: nix develop --no-update-lock-file . -c cargo build --locked -p maple-agent-updater --example validate-release-archive
      - name: Sign and notarize Agent packages
        run: nix develop --no-update-lock-file . -c ./scripts/package-release.sh "$MAPLE_RELEASE_PROFILE"
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Scan actual Prod updater archive with installer parser
        if: ${{ matrix.variant == 'prod' }}
        run: nix develop --no-update-lock-file . -c ./scripts/verify-updater-archive.sh "dist/$MAPLE_RELEASE_PROFILE"
      - name: Attest final macOS packages
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb
        with:
          subject-path: apps/maple-agent/dist/${{ matrix.variant }}/*
      - name: Upload Agent packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maple-agent-${{ matrix.variant }}-macos-aarch64-${{ github.run_id }}
          overwrite: true
          path: apps/maple-agent/dist/${{ matrix.variant }}/
          if-no-files-found: error
          retention-days: 30

  macos-unsigned:
    name: Unsigned macOS packaging (${{ matrix.variant }})
    needs: [changes, macos-build]
    if: ${{ always() && !cancelled() && needs.macos-build.result == 'success' && github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.agent != 'false') }}
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [dev]
    env:
      MAPLE_RELEASE_PROFILE: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""

      - name: Verify pinned Nix runtime
        working-directory: .
        run: bash scripts/ci/verify-nix-runtime.sh
      - name: Select pinned Xcode
        working-directory: .
        run: python3 scripts/ci/select-xcode.py
      - name: Download exact prebuilt Agent binary and notices
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: maple-agent-${{ matrix.variant }}-macos-aarch64-prebuilt-${{ github.run_id }}
          path: apps/maple-agent/target
      - name: Verify prebuilt profile and source
        run: nix develop --no-update-lock-file . -c ./scripts/verify-prebuilt-release.sh "$MAPLE_RELEASE_PROFILE"
      - name: Build trusted installer archive scanner
        if: ${{ matrix.variant == 'prod' }}
        run: nix develop --no-update-lock-file . -c cargo build --locked -p maple-agent-updater --example validate-release-archive
      - name: Package unsigned Agent preview
        run: nix develop --no-update-lock-file . -c ./scripts/package-release.sh "$MAPLE_RELEASE_PROFILE" --unsigned
      - name: Scan actual Prod updater archive with installer parser
        if: ${{ matrix.variant == 'prod' }}
        run: nix develop --no-update-lock-file . -c ./scripts/verify-updater-archive.sh "dist/$MAPLE_RELEASE_PROFILE" --unsigned
      - name: Verify unsigned package profile and hashes
        run: nix develop --no-update-lock-file . -c ./scripts/verify-release.sh "$MAPLE_RELEASE_PROFILE" "dist/$MAPLE_RELEASE_PROFILE" --unsigned
      - name: Upload Agent packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maple-agent-${{ matrix.variant }}-macos-aarch64-unsigned-${{ github.run_id }}
          overwrite: true
          path: apps/maple-agent/dist/${{ matrix.variant }}/
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux bundle (${{ matrix.variant }})
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.agent != 'false') && (github.event_name == 'pull_request' || (github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))) }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
      actions: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name == 'pull_request' && '["dev"]' || '["dev","prod"]') }}
    env:
      MAPLE_RELEASE_PROFILE: ${{ matrix.variant }}
      DEPENDENCY_CACHE_JOB: Linux bundle (${{ matrix.variant }})
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""

      - name: Verify pinned Nix runtime
        working-directory: .
        run: bash scripts/ci/verify-nix-runtime.sh
      - name: Fingerprint the actual release environment
        id: environment
        run: nix develop --no-update-lock-file . -c python3 ../../scripts/ci/agent_cache_scope.py --profile release --output "$RUNNER_TEMP/agent-environment.json"
      - name: Restore validated master dependency archive
        id: dependency-archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ../../scripts/ci/agent_dependency_archive.py restore \
            --environment "$RUNNER_TEMP/agent-environment.json" --target "target" \
            --job-name "$DEPENDENCY_CACHE_JOB" --workflow agent-desktop-build.yml \
            --receipt "$RUNNER_TEMP/agent-dependency-receipt.json"

      - name: Cache Agent release dependencies
        id: rust-cache
        if: ${{ steps.dependency-archive.outputs.restored != 'true' }}
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: apps/maple-agent -> target
          add-rust-environment-hash-key: "true"
          key: maple-agent-release-v2-${{ matrix.variant }}-${{ steps.environment.outputs.compatibility }}
          cmd-format: python3 "${{ github.workspace }}/scripts/ci/agent_cache_command.py" {0}
          save-if: "false"
      - name: Check whether Cargo targets were restored
        id: restored-target
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          target = Path(os.environ["GITHUB_WORKSPACE"]) / "apps/maple-agent/target"
          present = any(
              any(fingerprint.iterdir()) and any(
                  output.is_file() and output.stat().st_size > 0
                  for pattern in ("*.rlib", "*.rmeta")
                  for output in (fingerprint.parent / "deps").glob(pattern)
              )
              for fingerprint in target.rglob(".fingerprint") if fingerprint.is_dir()
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"present={str(present).lower()}\n")
          PYTHON

      - name: Restore compatible legacy Cargo targets on a cache miss
        if: ${{ steps.dependency-archive.outputs.restored != 'true' && steps.restored-target.outputs.present != 'true' }}
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: apps/maple-agent -> target
          add-rust-environment-hash-key: "false"
          key: maple-agent-release-v2-${{ matrix.variant }}-${{ steps.environment.outputs.legacy_compatibility }}
          cmd-format: python3 "${{ github.workspace }}/scripts/ci/agent_cache_command.py" {0}
          save-if: "false"
      - name: Record the current release environment after restore
        run: |
          mkdir -p target/ci-metrics
          cp "$RUNNER_TEMP/agent-environment.json" target/ci-metrics/environment.json
      - name: Verify the canonical SDK and proxy dependency graph
        run: |
          metadata="$RUNNER_TEMP/agent-workspace-metadata.json"
          # shellcheck disable=SC2016 # The child shell expands its own positional argument.
          nix develop --no-update-lock-file . -c bash -c 'cargo metadata --locked --format-version 1 > "$1"' -- "$metadata"
          python3 ../../scripts/ci/verify-agent-rust-deps.py "$metadata"
          nix develop --no-update-lock-file . -c python3 scripts/verify-sqlcipher-build.py "$metadata"
      - name: Build optimized Agent with embedded profile
        run: nix develop --no-update-lock-file . -c python3 ../../scripts/ci/agent_measure.py --phase release-build --target target -- ./scripts/build-release.sh "$MAPLE_RELEASE_PROFILE"
      - name: Package Linux installed bundle
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then args=(--unsigned); fi
          nix develop --no-update-lock-file . -c ./scripts/package-release.sh "$MAPLE_RELEASE_PROFILE" "${args[@]}"
      - name: Verify Linux package profile and hashes
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then args=(--unsigned); fi
          nix develop --no-update-lock-file . -c ./scripts/verify-release.sh "$MAPLE_RELEASE_PROFILE" "dist/$MAPLE_RELEASE_PROFILE" "${args[@]}" --platform linux-x86_64
      - name: Upload Agent packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maple-agent-${{ matrix.variant }}-linux-x86_64-${{ github.run_id }}
          overwrite: true
          path: apps/maple-agent/dist/${{ matrix.variant }}/
          if-no-files-found: error
          retention-days: 30

      - name: Prepare trusted dependency archive after validation
        id: dependency-seed
        if: ${{ success() && github.repository == 'MaplePrivacyLabs/Maple' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          python3 ../../scripts/ci/agent_dependency_archive.py pack \
            --environment "$RUNNER_TEMP/agent-environment.json" --metadata "$RUNNER_TEMP/agent-workspace-metadata.json" \
            --target "target" --job-name "$DEPENDENCY_CACHE_JOB" --workflow agent-desktop-build.yml \
            --output-dir "$RUNNER_TEMP/agent-dependency-seed" \
            --receipt "$RUNNER_TEMP/agent-dependency-receipt.json"

      - name: Upload durable dependency archive
        if: ${{ success() && github.repository == 'MaplePrivacyLabs/Maple' && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.dependency-seed.outputs.needs-upload == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.dependency-seed.outputs.artifact-name }}
          path: |
            ${{ runner.temp }}/agent-dependency-seed/manifest.json
            ${{ runner.temp }}/agent-dependency-seed/dependencies.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 3

      - name: Summarize release phase timings and target size
        if: always()
        run: python3 ../../scripts/ci/agent_measure.py --summarize target
      - name: Upload bounded release measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maple-agent-release-metrics-${{ matrix.variant }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/maple-agent/target/ci-metrics/
          if-no-files-found: warn
          retention-days: 7

  attest-linux:
    name: Attest Linux packages (${{ matrix.variant }})
    needs: linux
    if: ${{ needs.linux.result == 'success' && github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [dev, prod]
    env:
      MAPLE_RELEASE_PROFILE: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""
      - name: Verify pinned Nix runtime
        working-directory: .
        run: bash scripts/ci/verify-nix-runtime.sh
      - name: Build trusted installer archive scanner
        run: nix develop --no-update-lock-file . -c cargo build --locked -p maple-agent-updater --example validate-release-archive
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: maple-agent-${{ matrix.variant }}-linux-x86_64-${{ github.run_id }}
          path: artifacts
      - name: Validate exact Linux artifact inventory and identity
        run: python3 scripts/release-info.py verify "$MAPLE_RELEASE_PROFILE" ../../artifacts --source-sha "$GITHUB_SHA" --platform linux-x86_64
      - name: Scan actual Linux bundle with installer parser
        run: nix develop --no-update-lock-file . -c ./scripts/verify-updater-archive.sh ../../artifacts --profile "$MAPLE_RELEASE_PROFILE" --platform linux-x86_64
      - name: Attest exact downloadable Linux packages
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb
        with:
          subject-path: artifacts/*

  verify-macos:
    name: Verify downloaded macOS (${{ matrix.variant }})
    needs: macos
    permissions:
      contents: read
      attestations: read
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [dev, prod]
    env:
      MAPLE_RELEASE_PROFILE: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""

      - name: Verify pinned Nix runtime
        working-directory: .
        run: bash scripts/ci/verify-nix-runtime.sh
      - name: Select pinned Xcode
        working-directory: .
        run: python3 scripts/ci/select-xcode.py
      - name: Download exact Agent packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: maple-agent-${{ matrix.variant }}-macos-aarch64-${{ github.run_id }}
          path: artifacts
      - name: Verify downloaded package provenance
        working-directory: .
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            test -f "$file" && test ! -L "$file"
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/agent-desktop-build.yml" \
              --source-ref refs/heads/master --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify downloaded signatures, notarization, hashes and profile
        run: nix develop --no-update-lock-file . -c ./scripts/verify-release.sh "$MAPLE_RELEASE_PROFILE" "../../artifacts"

  verify-linux:
    name: Verify downloaded Linux (${{ matrix.variant }})
    needs: [linux, attest-linux]
    if: ${{ always() && !cancelled() && needs.linux.result == 'success' && (github.event_name == 'pull_request' || (needs.attest-linux.result == 'success' && github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))) }}
    permissions:
      contents: read
      attestations: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name == 'pull_request' && '["dev"]' || '["dev","prod"]') }}
    env:
      MAPLE_RELEASE_PROFILE: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""

      - name: Verify pinned Nix runtime
        working-directory: .
        run: bash scripts/ci/verify-nix-runtime.sh
      - name: Download exact Agent packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: maple-agent-${{ matrix.variant }}-linux-x86_64-${{ github.run_id }}
          path: artifacts
      - name: Verify downloaded package provenance
        if: ${{ github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        working-directory: .
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            test -f "$file" && test ! -L "$file"
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/agent-desktop-build.yml" \
              --source-ref refs/heads/master --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build trusted installer archive scanner
        run: nix develop --no-update-lock-file . -c cargo build --locked -p maple-agent-updater --example validate-release-archive
      - name: Scan downloaded Linux bundle with installer parser
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then args=(--unsigned); fi
          nix develop --no-update-lock-file . -c ./scripts/verify-updater-archive.sh "../../artifacts" --profile "$MAPLE_RELEASE_PROFILE" --platform linux-x86_64 "${args[@]}"
      - name: Verify downloaded hashes and profile
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then args=(--unsigned); fi
          nix develop --no-update-lock-file . -c ./scripts/verify-release.sh "$MAPLE_RELEASE_PROFILE" "../../artifacts" "${args[@]}" --platform linux-x86_64
      - name: Smoke downloaded Linux bundle without Nix
        working-directory: .
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(artifacts/*-linux-x86_64.tar.gz)
          test "${#archives[@]}" -eq 1
          test -d /etc/ssl/certs
          docker run --rm --platform linux/amd64 --user 65534:65534 \
            --network none --read-only --tmpfs /tmp:exec,mode=1777 \
            --volume "$PWD/artifacts:/artifacts:ro" \
            --volume "$PWD/apps/maple-agent/scripts/smoke-linux-bundle-host.sh:/checks/smoke-linux-bundle-host.sh:ro" \
            --volume /etc/ssl/certs:/etc/ssl/certs:ro \
            ubuntu@sha256:f610ab94648195aa356059f5b41d6085c9d4d903c072430cdd1af7bdb646106b /bin/sh -ec '
              cd /tmp
              tar -xzpf /artifacts/*-linux-x86_64.tar.gz
              ./maple-agent*.app/AppRun --version >&2
              ./maple-agent*.app/AppRun --build-info
              MAPLE_AGENT_SMOKE_DIAGNOSTICS=1 /bin/sh /checks/smoke-linux-bundle-host.sh ./maple-agent*.app/AppRun >&2
            ' > "$RUNNER_TEMP/portable-build-info.json"
          python3 - "$MAPLE_RELEASE_PROFILE" "$RUNNER_TEMP/portable-build-info.json" artifacts/build-info.json <<'PY'
          import json
          import sys
          actual = json.load(open(sys.argv[2]))
          expected = json.load(open(sys.argv[3]))
          if actual != expected or actual.get("profile") != sys.argv[1]:
              raise SystemExit("portable Linux bundle build profile differs from verified package")
          print("Verified Agent launch and embedded profile without a Nix installation")
          PY
