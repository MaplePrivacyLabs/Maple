name: Maple Agent Desktop Builds
run-name: ${{ inputs.release && 'Release Maple Work' || '' }}

# A push builds signed Prod for macOS, Linux and Windows x64, the nightly run
# builds Dev for every platform, and a dispatch builds both. A dispatch with
# `release` builds Prod for every platform and publishes it as the next update.
on:
  push:
    branches: [master]
  schedule:
    # Dev packages, when few master pushes land, so they rarely compete with a
    # Prod build for runners. GitHub starts scheduled runs late, often by hours,
    # so nothing may depend on exact times or on ci.yml's nightly having finished.
    - cron: "37 10 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: Publish this build as the next Maple Work update (bump apps/maple-agent/Cargo.toml first)
        type: boolean
        default: false
      notes:
        description: Release notes shown with the update
        type: string
        default: ""

# Signing is confined to protected master jobs; builders have a read-only token
# and no environment credentials. Pull requests rehearse unsigned Dev packages
# in ci.yml (agent-package-*) only with the ci:package or ci:full label.
permissions:
  contents: read

concurrency:
  # Each run keeps its own group, so neither running nor pending packages are
  # discarded by a later push.
  group: maple-agent-desktop-builds-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash
    working-directory: apps/maple-agent

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agent: ${{ steps.classify.outputs.selected }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Select Agent packaging
        id: classify
        working-directory: .
        # Dispatch, the nightly run, an unusable push base and selector errors all build.
        run: python3 scripts/ci/plan.py only agent-desktop >> "$GITHUB_OUTPUT"

  # Blacksmith's macOS image cannot download Xcode's Metal Toolchain, so GitHub's
  # xcode-27 image exports it for the macOS build, which compiles gpui's shaders.
  metal-toolchain:
    name: Export the Metal Toolchain
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.agent != 'false') && github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: xcode-27
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select pinned Xcode
        working-directory: .
        run: python3 scripts/ci/select-xcode.py
      - uses: ./.github/actions/export-metal-toolchain

  macos-build:
    name: Build macOS binary (${{ matrix.variant }})
    needs: [changes, metal-toolchain]
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.agent != 'false') && github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: blacksmith-6vcpu-macos-27
    permissions:
      contents: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.release && '["prod"]' || github.event_name == 'workflow_dispatch' && '["dev","prod"]' || github.event_name == 'schedule' && '["dev"]' || '["prod"]') }}
    env:
      MAPLE_RELEASE_PROFILE: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""
          # HTTP/2 stream resets from cache.nixos.org make Nix resume past
          # the end of a NAR (HTTP 416); HTTP/1.1 avoids the resets.
          extra-conf: http2 = false
      - name: Select pinned Xcode
        working-directory: .
        run: python3 scripts/ci/select-xcode.py
      - uses: ./.github/actions/import-metal-toolchain
      - name: Hash the Agent's third-party dependency graph and toolchain
        id: graph
        run: python3 ../../scripts/ci/cargo_graph_key.py Cargo.lock flake.lock ../../scripts/ci/apple-toolchain.json >> "$GITHUB_OUTPUT"
      - name: Restore the exact-key Agent release cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # No restore-keys: a master build never starts from another dependency
          # graph's artifacts. The hash covers flake.lock, every third-party
          # package and edge in Cargo.lock and, on macOS, the Xcode pin, not workspace
          # or path crate versions (Cargo rebuilds those anyway). Prod pushes save it; Dev builds only
          # restore it (Cargo rebuilds what the profile changes).
          key: ci-v1-agent-release-${{ runner.os }}-${{ steps.graph.outputs.hash }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/maple-agent/target
      - name: Build optimized Agent with embedded profile
        run: nix develop --no-update-lock-file . -c ./scripts/build-release.sh "$MAPLE_RELEASE_PROFILE"
      - name: Upload prebuilt Agent binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prebuilt-maple-agent-${{ matrix.variant }}-macos-aarch64-${{ github.run_id }}
          overwrite: true
          path: apps/maple-agent/target/release/maple-agent
          if-no-files-found: error
          retention-days: 7

      - name: Save the Agent release cache (master pushes only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.cache.outputs.cache-primary-key }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/maple-agent/target

  macos:
    name: Signed macOS (${{ matrix.variant }})
    needs: [changes, macos-build]
    if: ${{ always() && !cancelled() && needs.macos-build.result == 'success' && github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    environment: desktop-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.release && '["prod"]' || github.event_name == 'workflow_dispatch' && '["dev","prod"]' || github.event_name == 'schedule' && '["dev"]' || '["prod"]') }}
    env:
      MAPLE_RELEASE_PROFILE: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""
          # HTTP/2 stream resets from cache.nixos.org make Nix resume past
          # the end of a NAR (HTTP 416); HTTP/1.1 avoids the resets.
          extra-conf: http2 = false
      - name: Select pinned Xcode
        working-directory: .
        run: python3 scripts/ci/select-xcode.py
      - name: Download prebuilt Agent binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prebuilt-maple-agent-${{ matrix.variant }}-macos-aarch64-${{ github.run_id }}
          path: apps/maple-agent/target/release
      - name: Sign and notarize Agent packages
        run: |
          chmod 0755 target/release/maple-agent
          nix develop --no-update-lock-file . -c ./scripts/package-release.sh "$MAPLE_RELEASE_PROFILE"
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Attest final macOS packages
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb
        with:
          subject-path: apps/maple-agent/dist/${{ matrix.variant }}/*
      - name: Upload Agent packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maple-agent-${{ matrix.variant }}-macos-aarch64-${{ github.run_id }}
          overwrite: true
          path: apps/maple-agent/dist/${{ matrix.variant }}/
          if-no-files-found: error
          retention-days: 30

  windows-build:
    name: Build Windows binary (${{ matrix.variant }})
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.agent != 'false') && github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    # Fat LTO links on one thread, so GitHub's 16-core runner is no faster warm;
    # Blacksmith costs less. Its release cache lives in Blacksmith's store.
    runs-on: blacksmith-8vcpu-windows-2025
    permissions:
      contents: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.release && '["prod"]' || github.event_name == 'workflow_dispatch' && '["dev","prod"]' || github.event_name == 'schedule' && '["dev"]' || '["prod"]') }}
    env:
      MAPLE_RELEASE_PROFILE: ${{ matrix.variant }}
      # Ship the CRT with the executable rather than requiring a machine-wide
      # redistributable.
      RUSTFLAGS: -D warnings -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the pinned Windows toolchain and shader compiler
        uses: ./.github/actions/setup-agent-windows
        with:
          release: "true"
      - name: Hash the Agent's third-party dependency graph and toolchain
        id: graph
        run: python3 ../../scripts/ci/cargo_graph_key.py Cargo.lock flake.lock >> "$GITHUB_OUTPUT"
      - name: Restore the exact-key Agent release cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # No restore-keys: a master build never starts from another dependency
          # graph's artifacts. The hash covers flake.lock and every third-party
          # package and edge in Cargo.lock, not workspace or path crate versions
          # (Cargo rebuilds those anyway). Prod pushes save it; Dev builds only
          # restore it (Cargo rebuilds what the profile changes).
          key: ci-v1-agent-release-${{ runner.os }}-${{ steps.graph.outputs.hash }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/maple-agent/target
      - name: Build Windows release binary without signing credentials
        run: ./scripts/build-release.sh "$MAPLE_RELEASE_PROFILE"
      - name: Upload prebuilt Windows binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prebuilt-maple-agent-${{ matrix.variant }}-windows-x86_64-${{ github.run_id }}
          overwrite: true
          path: apps/maple-agent/target/release/maple-agent.exe
          if-no-files-found: error
          retention-days: 7

      - name: Save the Agent release cache (master pushes only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.cache.outputs.cache-primary-key }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/maple-agent/target

  # ARM64 builds natively on GitHub's Windows ARM image, which is slow, so it
  # builds for releases, the nightly run and dispatches, never on a push.
  windows-arm64-build:
    name: Build Windows ARM64 binary (${{ matrix.variant }})
    needs: changes
    if: ${{ always() && !cancelled() && github.event_name != 'push' && github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: windows-11-arm
    permissions:
      contents: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.release && '["prod"]' || github.event_name == 'workflow_dispatch' && '["dev","prod"]' || github.event_name == 'schedule' && '["dev"]' || '["prod"]') }}
    env:
      MAPLE_RELEASE_PROFILE: ${{ matrix.variant }}
      MAPLE_WINDOWS_ARCH: aarch64
      RUSTFLAGS: -D warnings -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the pinned Windows toolchain and shader compiler
        uses: ./.github/actions/setup-agent-windows
        with:
          release: "true"
          architecture: aarch64
      - name: Hash the Agent's third-party dependency graph and toolchain
        id: graph
        run: python3 ../../scripts/ci/cargo_graph_key.py Cargo.lock flake.lock >> "$GITHUB_OUTPUT"
      - name: Restore the exact-key Agent release cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ci-v1-agent-arm64-release-${{ steps.graph.outputs.hash }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/maple-agent/target
      - name: Build Windows release binary without signing credentials
        run: ./scripts/build-release.sh "$MAPLE_RELEASE_PROFILE"
      - name: Upload prebuilt Windows binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prebuilt-maple-agent-${{ matrix.variant }}-windows-aarch64-${{ github.run_id }}
          overwrite: true
          path: apps/maple-agent/target/release/maple-agent.exe
          if-no-files-found: error
          retention-days: 7
      - name: Save the Agent ARM64 release cache
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.cache.outputs.cache-primary-key }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/maple-agent/target

  windows:
    name: Signed Windows${{ matrix.architecture == 'aarch64' && ' ARM64' || '' }} (${{ matrix.variant }})
    needs: [windows-build, windows-arm64-build]
    if: ${{ always() && !cancelled() && needs.windows-build.result == 'success' && github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.release && '["prod"]' || github.event_name == 'workflow_dispatch' && '["dev","prod"]' || github.event_name == 'schedule' && '["dev"]' || '["prod"]') }}
        architecture: ${{ fromJSON(github.event_name == 'push' && '["x86_64"]' || '["x86_64","aarch64"]') }}
    env:
      MAPLE_RELEASE_PROFILE: ${{ matrix.variant }}
      MAPLE_WINDOWS_ARCH: ${{ matrix.architecture }}
      MAPLE_PACKAGE_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download prebuilt Windows binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prebuilt-maple-agent-${{ matrix.variant }}-windows-${{ matrix.architecture }}-${{ github.run_id }}
          path: apps/maple-agent/target/release
      - name: Azure login for Artifact Signing
        uses: azure/login@2dd0bbf4064d5a1812889dc200bb8eed2597f82a
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install pinned Artifact Signing module
        shell: pwsh
        run: ../../scripts/ci/install-windows-artifact-signing.ps1
      - name: Sign and package Windows Agent
        run: python3 scripts/windows-release.py package "$MAPLE_RELEASE_PROFILE" --arch "$MAPLE_WINDOWS_ARCH"
        env:
          MAPLE_WINDOWS_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          MAPLE_WINDOWS_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          MAPLE_WINDOWS_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
      - name: Attest final Windows packages
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb
        with:
          subject-path: apps/maple-agent/dist/${{ matrix.variant }}/*
      - name: Upload Agent packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maple-agent-${{ matrix.variant }}-windows-${{ matrix.architecture }}-${{ github.run_id }}
          overwrite: true
          path: apps/maple-agent/dist/${{ matrix.variant }}/
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux bundle (${{ matrix.variant }})
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.agent != 'false') && github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.release && '["prod"]' || github.event_name == 'workflow_dispatch' && '["dev","prod"]' || github.event_name == 'schedule' && '["dev"]' || '["prod"]') }}
    env:
      MAPLE_RELEASE_PROFILE: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""
          # HTTP/2 stream resets from cache.nixos.org make Nix resume past
          # the end of a NAR (HTTP 416); HTTP/1.1 avoids the resets.
          extra-conf: http2 = false
      - name: Hash the Agent's third-party dependency graph and toolchain
        id: graph
        run: python3 ../../scripts/ci/cargo_graph_key.py Cargo.lock flake.lock >> "$GITHUB_OUTPUT"
      - name: Restore the exact-key Agent release cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # No restore-keys: a master build never starts from another dependency
          # graph's artifacts. The hash covers flake.lock and every third-party
          # package and edge in Cargo.lock, not workspace or path crate versions
          # (Cargo rebuilds those anyway). Prod pushes save it; Dev builds only
          # restore it (Cargo rebuilds what the profile changes).
          key: ci-v1-agent-release-${{ runner.os }}-${{ steps.graph.outputs.hash }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/maple-agent/target
      - name: Build optimized Agent with embedded profile
        run: nix develop --no-update-lock-file . -c ./scripts/build-release.sh "$MAPLE_RELEASE_PROFILE"
      - name: Package Linux installed bundle
        run: nix develop --no-update-lock-file . -c ./scripts/package-release.sh "$MAPLE_RELEASE_PROFILE"
      - name: Upload Agent packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maple-agent-${{ matrix.variant }}-linux-x86_64-${{ github.run_id }}
          overwrite: true
          path: apps/maple-agent/dist/${{ matrix.variant }}/
          if-no-files-found: error
          retention-days: 30

      - name: Save the Agent release cache (master pushes only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.cache.outputs.cache-primary-key }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/maple-agent/target

  publish:
    name: Publish Maple Work update
    needs: [macos, windows, linux]
    if: ${{ inputs.release && github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' }}
    environment: updates-production
    concurrency:
      group: agent-updates-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download this run's Prod packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: maple-agent-prod-*-${{ github.run_id }}
          path: packages
      # The Linux build runs on Blacksmith; attest its packages from a GitHub-hosted runner.
      - name: Attest final Linux packages
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb
        with:
          subject-path: packages/maple-agent-prod-linux-x86_64-${{ github.run_id }}/*
      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      - name: Resolve Agent update credentials from Bitwarden Secrets Manager
        id: credentials
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.AGENT_UPDATES_BWS_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.AGENT_R2_ACCESS_KEY_ID_SECRET_ID }} > AWS_ACCESS_KEY_ID
            ${{ vars.AGENT_R2_SECRET_ACCESS_KEY_SECRET_ID }} > AWS_SECRET_ACCESS_KEY
            ${{ vars.AGENT_UPDATE_SIGNING_KEY_ID }} > AGENT_UPDATE_SIGNING_KEY
          set_env: false
      - name: Sign and publish the update feeds
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.credentials.outputs.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.credentials.outputs.AWS_SECRET_ACCESS_KEY }}
          AGENT_UPDATE_SIGNING_KEY: ${{ steps.credentials.outputs.AGENT_UPDATE_SIGNING_KEY }}
          R2_ENDPOINT: https://${{ vars.AGENT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ vars.AGENT_R2_BUCKET }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: python3 services/agent-updates/publish.py packages
