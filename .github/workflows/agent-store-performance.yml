name: Maple Agent store performance

on:
  pull_request:
    paths:
      - 'apps/maple-agent/**'
      - 'sdk/rust/**'
      - 'proxy/**'
      - '.github/workflows/agent-store-performance.yml'
  push:
    branches: [master]
    paths:
      - 'apps/maple-agent/**'
      - 'sdk/rust/**'
      - 'proxy/**'
      - '.github/workflows/agent-store-performance.yml'
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-store-performance-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: apps/maple-agent

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  performance:
    name: Store (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '[{"os":"blacksmith-8vcpu-ubuntu-2404","profile":"linux-ci","scale":"--ci"},{"os":"xcode-27","profile":"macos-full","scale":"--full"}]' || '[{"os":"blacksmith-8vcpu-ubuntu-2404","profile":"linux-ci","scale":"--ci"}]') }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install pinned Nix environment
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""

      - name: Verify pinned Nix runtime
        working-directory: .
        run: bash scripts/ci/verify-nix-runtime.sh

      - name: Select pinned Xcode
        if: runner.os == 'macOS'
        working-directory: .
        run: python3 scripts/ci/select-xcode.py

      - name: Cache benchmark dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/maple-agent -> target
          add-rust-environment-hash-key: "false"
          key: maple-store-bench-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/maple-agent/Cargo.lock', 'apps/maple-agent/flake.lock') }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Test the evidence evaluator
        run: python3 -m unittest discover -s crates/store-bench/tests -p 'test_*.py'

      - name: Measure the actual durable store
        run: nix develop --no-update-lock-file . -c cargo run --release --locked -p store-bench -- ${{ matrix.scale }} --output target/store-bench-${{ matrix.profile }}.json

      - name: Compare the recorded runner reference
        run: python3 crates/store-bench/scripts/evaluate.py target/store-bench-${{ matrix.profile }}.json --profile ${{ matrix.profile }}

      - name: Save measurements and their digest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: store-bench-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/maple-agent/target/store-bench-${{ matrix.profile }}.json
            apps/maple-agent/target/store-bench-${{ matrix.profile }}.json.sha256
          if-no-files-found: error
          retention-days: 14
