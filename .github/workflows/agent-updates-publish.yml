name: Publish Agent Updates
run-name: Publish Agent ${{ inputs.version }} from verified build ${{ inputs.build_run_id }}

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Exact completed trusted master run with verified Prod packages
        required: true
        type: string
      version:
        description: Stable Agent version matching the selected Prod packages
        required: true
        type: string
      notes:
        description: Plain-text release notes (must remain identical on retries)
        required: true
        type: string
      include_linux:
        description: Publish this release for Linux too (disable only for a legacy macOS-only run)
        required: true
        default: true
        type: boolean
      include_windows:
        description: Publish this release for Windows too (disable only for a legacy macOS/Linux run)
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  # Operator pointer changes must use this same serialization boundary.
  group: agent-updates-production
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""
      - name: Verify pinned Nix runtime
        run: bash scripts/ci/verify-nix-runtime.sh
      - name: Require separately approved production setup
        env:
          ACTIVATED: ${{ vars.AGENT_UPDATES_ENABLED }}
          PUBLIC_KEY: ${{ vars.AGENT_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          [ "$ACTIVATED" = true ] || { echo 'Agent update production setup has not been activated by its owner.' >&2; exit 1; }
          [ -n "$PUBLIC_KEY" ] || { echo 'Agent public update key is not configured.' >&2; exit 1; }
          printf '%s\n' "$PUBLIC_KEY" > public-key.pub
      - name: Verify exact build, download final packages and prepare without secrets
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
          INCLUDE_LINUX: ${{ inputs.include_linux }}
          INCLUDE_WINDOWS: ${{ inputs.include_windows }}
        run: |
          nix develop --no-update-lock-file .#ci -c bash -euo pipefail <<'PREPARE'
          linux_args=()
          windows_args=()
          if [ "$INCLUDE_LINUX" = true ]; then linux_args=(--linux); fi
          if [ "$INCLUDE_WINDOWS" = true ]; then windows_args=(--windows); fi
          python3 services/agent-updates/publisher/publisher.py trust \
            --run-id "$BUILD_RUN_ID" "${linux_args[@]}" "${windows_args[@]}" --output trust.json
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$(jq -er .artifacts.macos trust.json)" --dir packages/macos
          linux_args=()
          if [ "$INCLUDE_LINUX" = true ]; then
            gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$(jq -er .artifacts.linux trust.json)" --dir packages/linux
            linux_args=(--linux packages/linux)
          fi
          windows_args=()
          if [ "$INCLUDE_WINDOWS" = true ]; then
            gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$(jq -er .artifacts.windows trust.json)" --dir packages/windows
            windows_args=(--windows packages/windows)
          fi
          printf '%s' "$RELEASE_NOTES" > notes.txt
          python3 services/agent-updates/publisher/publisher.py prepare \
            --run-id "$BUILD_RUN_ID" --version "$RELEASE_VERSION" --build "$(jq -er .build trust.json)" \
            --macos packages/macos "${linux_args[@]}" "${windows_args[@]}" --notes-file notes.txt --public-key public-key.pub --output bundle
          PREPARE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-update-prepared-${{ github.run_id }}
          path: bundle/
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  reserve:
    needs: verify
    if: ${{ github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' }}
    environment: updates-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""
      - name: Verify pinned Nix runtime
        run: bash scripts/ci/verify-nix-runtime.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: agent-update-prepared-${{ github.run_id }}
          path: bundle
      - name: Realize pinned publisher tools before retrieving credentials
        run: nix develop --no-update-lock-file .#ci -c true
      - name: Resolve Agent bucket credentials from Bitwarden Secrets Manager
        id: r2-credentials
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.AGENT_UPDATES_BWS_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.AGENT_R2_ACCESS_KEY_ID_SECRET_ID }} > AWS_ACCESS_KEY_ID
            ${{ vars.AGENT_R2_SECRET_ACCESS_KEY_SECRET_ID }} > AWS_SECRET_ACCESS_KEY
          set_env: false
      - name: Reserve immutable exact manifest and reuse prior signed envelope
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.r2-credentials.outputs.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.r2-credentials.outputs.AWS_SECRET_ACCESS_KEY }}
          R2_ACCOUNT: ${{ vars.AGENT_R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.AGENT_R2_BUCKET }}
        run: |
          set -euo pipefail
          [[ "$R2_ACCOUNT" =~ ^[0-9a-f]{32}$ ]]
          [ -n "$R2_BUCKET" ]
          nix develop --no-update-lock-file .#ci -c python3 services/agent-updates/publisher/publisher.py reserve \
            --bundle bundle --public-key bundle/public-key.pub \
            --endpoint "https://${R2_ACCOUNT}.r2.cloudflarestorage.com" --bucket "$R2_BUCKET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-update-reserved-${{ github.run_id }}
          path: bundle/
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: reserve
    if: ${{ github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' }}
    environment: updates-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""
      - name: Verify pinned Nix runtime
        run: bash scripts/ci/verify-nix-runtime.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: agent-update-reserved-${{ github.run_id }}
          path: bundle
      - name: Realize pinned publisher tools before retrieving credentials
        run: nix develop --no-update-lock-file .#ci -c true
      - name: Resolve Agent update key from Bitwarden Secrets Manager
        id: signing-key
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.AGENT_UPDATES_BWS_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.AGENT_UPDATE_SIGNING_KEY_ID }} > AGENT_UPDATE_SIGNING_KEY
          set_env: false
      - name: Sign exact reserved manifest with Agent-only key
        env:
          AGENT_UPDATE_SIGNING_KEY: ${{ steps.signing-key.outputs.AGENT_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          [ -n "$AGENT_UPDATE_SIGNING_KEY" ]
          printf '%s\n' "$AGENT_UPDATE_SIGNING_KEY" > "$key_file"
          unset AGENT_UPDATE_SIGNING_KEY
          nix develop --no-update-lock-file .#ci -c python3 services/agent-updates/publisher/publisher.py sign \
            --bundle bundle --public-key bundle/public-key.pub --secret-key "$key_file"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-update-signed-${{ github.run_id }}
          path: bundle/
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: sign
    if: ${{ github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' }}
    environment: updates-production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""
      - name: Verify pinned Nix runtime
        run: bash scripts/ci/verify-nix-runtime.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: agent-update-signed-${{ github.run_id }}
          path: bundle
      - name: Realize pinned publisher tools before retrieving credentials
        run: nix develop --no-update-lock-file .#ci -c true
      - name: Resolve Agent bucket credentials from Bitwarden Secrets Manager
        id: r2-credentials
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.AGENT_UPDATES_BWS_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.AGENT_R2_ACCESS_KEY_ID_SECRET_ID }} > AWS_ACCESS_KEY_ID
            ${{ vars.AGENT_R2_SECRET_ACCESS_KEY_SECRET_ID }} > AWS_SECRET_ACCESS_KEY
          set_env: false
      - name: Upload immutably, conditionally promote, and verify public delivery
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.r2-credentials.outputs.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.r2-credentials.outputs.AWS_SECRET_ACCESS_KEY }}
          R2_ACCOUNT: ${{ vars.AGENT_R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.AGENT_R2_BUCKET }}
        run: |
          set -euo pipefail
          [[ "$R2_ACCOUNT" =~ ^[0-9a-f]{32}$ ]]
          [ -n "$R2_BUCKET" ]
          nix develop --no-update-lock-file .#ci -c python3 services/agent-updates/publisher/publisher.py publish \
            --bundle bundle --public-key bundle/public-key.pub \
            --endpoint "https://${R2_ACCOUNT}.r2.cloudflarestorage.com" --bucket "$R2_BUCKET" \
            --base-url https://updates.maple.ai
