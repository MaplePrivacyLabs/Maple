name: Agent Update Delivery Tests

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/agent-updates-*.yml"
      - "services/agent-updates/**"
      - "services/download-tracking/**"
      - "scripts/ci/agent-updates.sh"
      - "scripts/ci/test_agent_updates_workflows.py"
      - "scripts/ci/_common.sh"
      - "apps/maple-agent/scripts/release-info.py"
      - "apps/maple-agent/release-profiles.json"
      - "flake.nix"
      - "flake.lock"
  pull_request:
    paths:
      - ".github/workflows/agent-updates-*.yml"
      - "services/agent-updates/**"
      - "services/download-tracking/**"
      - "scripts/ci/agent-updates.sh"
      - "scripts/ci/test_agent_updates_workflows.py"
      - "scripts/ci/_common.sh"
      - "apps/maple-agent/scripts/release-info.py"
      - "apps/maple-agent/release-profiles.json"
      - "flake.nix"
      - "flake.lock"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install pinned Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""
      - name: Verify pinned Nix runtime
        run: bash scripts/ci/verify-nix-runtime.sh
      - name: Check isolated Agent delivery
        run: nix develop --no-update-lock-file .#ci -c ./scripts/ci/agent-updates.sh
