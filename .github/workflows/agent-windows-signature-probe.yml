name: Agent Windows Historical Signature Probe

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      producer_run:
        description: Exact trusted master Desktop producer run
        type: string
        required: true
      producer_attempt:
        description: Exact completed producer attempt
        type: string
        required: true
      source_sha:
        description: Exact producer source SHA
        type: string
        required: true
      artifact_id:
        description: Exact final Prod Windows artifact ID
        type: string
        required: true
      zip_sha256:
        description: Exact API artifact ZIP SHA256
        type: string
        required: true
      zip_bytes:
        description: Exact API artifact ZIP byte size
        type: string
        required: true
      pe_member:
        description: Exact signed PE basename in the artifact
        type: string
        required: true
      pe_sha256:
        description: Exact signed PE SHA256
        type: string
        required: true

jobs:
  signature-probe:
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      RUSTFLAGS: -D warnings
      MAPLE_PROBE_RUN: ${{ inputs.producer_run }}
      MAPLE_PROBE_ATTEMPT: ${{ inputs.producer_attempt }}
      MAPLE_PROBE_SOURCE: ${{ inputs.source_sha }}
      MAPLE_PROBE_ARTIFACT: ${{ inputs.artifact_id }}
      MAPLE_PROBE_ZIP_SHA: ${{ inputs.zip_sha256 }}
      MAPLE_PROBE_ZIP_BYTES: ${{ inputs.zip_bytes }}
      MAPLE_PROBE_PE_MEMBER: ${{ inputs.pe_member }}
      MAPLE_PROBE_PE_SHA: ${{ inputs.pe_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.98.0
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
        with:
          arch: x64
      - name: Select and verify the native linker
        working-directory: apps/maple-agent
        shell: pwsh
        run: python3 ../../scripts/ci/agent_windows.py
      - name: Validate the exact historical reference without execution
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/windows_signature_reference.py
      - name: Run the production Authenticode verifier against the reference
        working-directory: apps/maple-agent
        shell: pwsh
        run: |
          $reference = Join-Path $env:RUNNER_TEMP 'maple-windows-signature-probe/reference.exe'
          $result = Join-Path $env:RUNNER_TEMP 'maple-windows-signature-probe/signature-result.json'
          cargo run -p maple-agent-updater --locked --example windows_signature_probe -- $reference $env:MAPLE_PROBE_PE_SHA > $result
          if ($LASTEXITCODE -ne 0) { throw 'Native historical signature interoperability probe failed.' }
      - name: Preserve exact selection and native result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-historical-signature-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/maple-windows-signature-probe/selection.json
            ${{ runner.temp }}/maple-windows-signature-probe/signature-result.json
          if-no-files-found: error
          retention-days: 14
