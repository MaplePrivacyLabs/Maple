name: Auth Pages CI

permissions:
  contents: read

on:
  pull_request:
    # Include stacked PRs and forks; this job has no publishing authority.
    paths:
      - ".github/workflows/auth-pages-*.yml"
      - ".github/workflows/pages-tests.yml"
      - "apps/maple-research/frontend/**"
      - "!apps/maple-research/frontend/src-tauri/**"
      - "sdk/src/**"
      - "!sdk/src/lib/test/**"
      - "sdk/bun.lock"
      - "sdk/bunfig.toml"
      - "sdk/package.json"
      - "sdk/tsconfig.build.json"
      - "sdk/tsconfig.json"
      - "sdk/vite.config.ts"
      - "scripts/prepare-frontend-deps.sh"
      - "scripts/prepare-typescript-sdk.sh"
      - "scripts/ci/_common.sh"
      - "scripts/ci/frontend.sh"
      - "scripts/ci/web.sh"
      - "scripts/ci/auth-web.sh"
      - "scripts/ci/pages_*.py"
      - "scripts/ci/test_pages_*.py"
      - "flake.nix"
      - "flake.lock"
  push:
    branches: [master]
    paths:
      - ".github/workflows/auth-pages-*.yml"
      - ".github/workflows/pages-tests.yml"
      - "apps/maple-research/frontend/**"
      - "!apps/maple-research/frontend/src-tauri/**"
      - "sdk/src/**"
      - "!sdk/src/lib/test/**"
      - "sdk/bun.lock"
      - "sdk/bunfig.toml"
      - "sdk/package.json"
      - "sdk/tsconfig.build.json"
      - "sdk/tsconfig.json"
      - "sdk/vite.config.ts"
      - "scripts/prepare-frontend-deps.sh"
      - "scripts/prepare-typescript-sdk.sh"
      - "scripts/ci/_common.sh"
      - "scripts/ci/frontend.sh"
      - "scripts/ci/web.sh"
      - "scripts/ci/auth-web.sh"
      - "scripts/ci/pages_*.py"
      - "scripts/ci/test_pages_*.py"
      - "flake.nix"
      - "flake.lock"

jobs:
  auth:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 30
    steps:
      - name: Checkout auth source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          github-token: ""

      - name: Test Pages artifact and deployment boundaries
        run: nix build --no-update-lock-file --no-link --print-build-logs .#checks.x86_64-linux.pages

      - name: Test shared frontend
        run: nix develop --no-update-lock-file .#ci -c bash scripts/ci/frontend.sh

      - name: Build app with development services
        env:
          MAPLE_WEB_ENVIRONMENT: pr
        run: nix develop --no-update-lock-file .#ci -c bash scripts/ci/web.sh

      - name: Build auth with development services
        env:
          MAPLE_AUTH_ENVIRONMENT: pr
        run: nix develop --no-update-lock-file .#ci -c bash scripts/ci/auth-web.sh
