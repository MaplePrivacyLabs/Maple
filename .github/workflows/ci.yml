# CI: the single required check (ci-ok) for every pull request, on any base.
# Lane selection lives in scripts/ci/lanes.py and scripts/ci/plan.py. Generic
# lanes run in the `nix` and `windows` matrices; a special job exists only where
# a step list cannot be expressed generically (services, OIDC, artifacts, or a
# cache that another workflow writes).
# Never add `paths:` here: ci-ok must always report.
name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [master]
  schedule:
    # Every lane on the master tip: refreshes the caches and catches misroutes.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      lanes:
        description: "Lane ids (comma-separated) or 'all'"
        type: string
        default: all

permissions:
  contents: read

concurrency:
  # PRs replace superseded runs. Master, queue and dispatch runs are grouped per
  # SHA and never cancelled, so every master commit gets a full verdict.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read          # live PR labels: add a label, then re-run
      pull-requests: read
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
      nix: ${{ steps.plan.outputs.nix }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Select lanes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          LANES_INPUT: ${{ inputs.lanes }}
          CI_LINUX_RUNNER: ${{ vars.CI_LINUX_RUNNER }}
          CI_LINUX_HEAVY_RUNNER: ${{ vars.CI_LINUX_HEAVY_RUNNER }}
          CI_MACOS_RUNNER: ${{ vars.CI_MACOS_RUNNER }}
          CI_WINDOWS_RUNNER: ${{ vars.CI_WINDOWS_RUNNER }}
        run: python3 scripts/ci/plan.py github

  nix:
    name: ${{ matrix.id }}
    needs: plan
    if: needs.plan.outputs.nix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.nix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: Select pinned Xcode
        if: runner.os == 'macOS'
        run: python3 scripts/ci/select-xcode.py
      - name: Rust cache (restore everywhere, save only on master and on Blacksmith)
        if: matrix.cache != ''
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ci-v1
          # rust-cache ignores `key` when `shared-key` is set, so the lockfile
          # hash (which also pins the flake's toolchain) goes into the shared key.
          shared-key: ${{ matrix.cache }}-${{ matrix.cache_key }}
          workspaces: ${{ matrix.workspaces }}
          add-rust-environment-hash-key: "false"
          # The action runs cargo from the workspace directory: use an absolute flake path.
          cmd-format: nix develop --no-update-lock-file ${{ github.workspace }}/${{ matrix.flake }} -c {0}
          # A failover to a GitHub-hosted runner must not fill GitHub's small cache store.
          save-if: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'schedule') && startsWith(matrix.runner, 'blacksmith-') }}
      - name: Run lane
        env:
          LANE: ${{ matrix.id }}
        run: python3 scripts/ci/plan.py run "$LANE"

  windows:
    name: ${{ matrix.id }}
    needs: plan
    if: needs.plan.outputs.windows != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.windows) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-agent-windows
      - name: Rust cache (restore everywhere, save only on master and on Blacksmith)
        if: matrix.cache != ''
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ci-v1
          shared-key: ${{ matrix.cache }}-${{ matrix.cache_key }}
          workspaces: ${{ matrix.workspaces }}
          add-rust-environment-hash-key: "false"
          # A failover to a GitHub-hosted runner must not fill GitHub's small cache store.
          save-if: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'schedule') && startsWith(matrix.runner, 'blacksmith-') }}
      - name: Run lane
        env:
          LANE: ${{ matrix.id }}
        run: python3 scripts/ci/plan.py run "$LANE"

  # Unsigned Dev packages built like agent-desktop-build.yml's master builds, from
  # their master-written cache. Required when the packaging selector fires.
  agent-package-linux:
    name: agent-package-linux
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes)['agent-package-linux']
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: Restore master's Agent release cache (read-only)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Exactly agent-desktop-build.yml's builder key; it is the only writer.
          key: ci-v1-agent-release-${{ runner.os }}-${{ hashFiles('apps/maple-agent/flake.lock', 'apps/maple-agent/Cargo.lock') }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/maple-agent/target
      - name: Build, package, verify and smoke-test an unsigned Dev bundle
        run: python3 scripts/ci/plan.py run agent-package-linux
      - name: Upload the unsigned package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maple-agent-dev-linux-x86_64-unsigned-${{ github.run_id }}
          path: apps/maple-agent/dist/dev/
          if-no-files-found: error
          retention-days: 7

  agent-package-macos:
    name: agent-package-macos
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes)['agent-package-macos']
    runs-on: ${{ vars.CI_MACOS_RUNNER || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: Select pinned Xcode
        run: python3 scripts/ci/select-xcode.py
      - name: Restore master's Agent release cache (read-only)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Exactly agent-desktop-build.yml's builder key; it is the only writer.
          key: ci-v1-agent-release-${{ runner.os }}-${{ hashFiles('apps/maple-agent/flake.lock', 'apps/maple-agent/Cargo.lock') }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/maple-agent/target
      - name: Build, package and verify an unsigned Dev app
        run: python3 scripts/ci/plan.py run agent-package-macos
      - name: Upload the unsigned package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maple-agent-dev-macos-aarch64-unsigned-${{ github.run_id }}
          path: apps/maple-agent/dist/dev/
          if-no-files-found: error
          retention-days: 7

  agent-package-windows:
    name: agent-package-windows
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes)['agent-package-windows']
    runs-on: ${{ vars.CI_WINDOWS_RUNNER || 'blacksmith-8vcpu-windows-2025' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-agent-windows
        with:
          release: "true"
      - name: Restore master's Agent release cache (read-only)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Exactly agent-desktop-build.yml's builder key; it is the only writer.
          key: ci-v1-agent-release-${{ runner.os }}-${{ hashFiles('apps/maple-agent/flake.lock', 'apps/maple-agent/Cargo.lock') }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/maple-agent/target
      - name: Build, package and verify an unsigned Dev installer
        run: python3 scripts/ci/plan.py run agent-package-windows
      - name: Upload the unsigned package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maple-agent-dev-windows-x86_64-unsigned-${{ github.run_id }}
          path: apps/maple-agent/dist/dev/
          if-no-files-found: error
          retention-days: 7

  # Research Rust on PRs, warm from rust-tests.yml's master cache (read-only).
  research-rust:
    name: research-rust
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes)['research-rust']
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: Restore master's Research Rust cache (read-only)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Exactly rust-tests.yml's key and paths; it is the only writer.
          key: ci-v1-research-rust-${{ hashFiles('apps/maple-research/frontend/src-tauri/Cargo.lock', 'flake.lock') }}
          restore-keys: ci-v1-research-rust-
          path: |
            ~/.cache/sccache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
      - name: Check formatting and local dependencies, then test
        run: python3 scripts/ci/plan.py run research-rust

  # Unsigned Research platform builds. They restore what the master signed
  # builds save and never save anything.
  research-ios:
    name: research-ios
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes)['research-ios']
    runs-on: ${{ vars.CI_MACOS_RUNNER || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 120 # a missed ONNX Runtime cache builds it from source
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        id: select_xcode
        run: python3 scripts/ci/select-xcode.py
      - uses: ./.github/actions/setup-nix
      - name: Restore master's ONNX Runtime iOS artifact (read-only)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            apps/maple-research/frontend/src-tauri/onnxruntime-ios
          key: release-onnxruntime-ios-artifact-1.23.2-xcode${{ steps.select_xcode.outputs.version }}-${{ steps.select_xcode.outputs.build }}-${{ hashFiles('flake.lock', 'flake.nix', 'scripts/ci/apple-toolchain.json', 'scripts/ci/select-xcode.py', 'scripts/ci/_common.sh', 'scripts/ci/ios-onnxruntime.sh', 'apps/maple-research/frontend/src-tauri/scripts/build-ios-onnxruntime-all.sh', 'apps/maple-research/frontend/src-tauri/scripts/canonicalize-static-archive.py', 'apps/maple-research/frontend/src-tauri/scripts/onnxruntime-pins.sh') }}
          restore-keys: |
            release-onnxruntime-ios-artifact-1.23.2-xcode${{ steps.select_xcode.outputs.version }}-${{ steps.select_xcode.outputs.build }}-
      - name: Build the iOS simulator app
        run: python3 scripts/ci/plan.py run research-ios
      - name: Upload the simulator app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maple-ios-simulator-pr
          path: |
            apps/maple-research/frontend/src-tauri/gen/apple/build/**/*.app
            apps/maple-research/frontend/src-tauri/target/reproducibility/ios-*.sha256
          retention-days: 5

  research-desktop-macos:
    name: research-desktop-macos
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes)['research-desktop-macos']
    runs-on: ${{ vars.CI_MACOS_RUNNER || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        run: python3 scripts/ci/select-xcode.py
      - uses: ./.github/actions/setup-nix
      - name: Restore master's macOS sccache (read-only)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/Mozilla.sccache
          key: ${{ runner.os }}-sccache-macos-release-${{ hashFiles('apps/maple-research/frontend/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-sccache-macos-release-
      - name: Build the unsigned universal app and DMG
        run: python3 scripts/ci/plan.py run research-desktop-macos
      - name: Upload the unsigned app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maple-macos-universal-pr
          path: |
            apps/maple-research/frontend/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            apps/maple-research/frontend/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            apps/maple-research/frontend/src-tauri/target/reproducibility/maple-macos-app.tar.gz
            apps/maple-research/frontend/src-tauri/target/reproducibility/desktop-pr-macos-*.sha256
          retention-days: 5

  research-desktop-linux:
    name: research-desktop-linux
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes)['research-desktop-linux']
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: Restore master's Linux sccache (read-only)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-linux-release-${{ hashFiles('apps/maple-research/frontend/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-sccache-linux-release-
      - name: Allow bubblewrap user namespaces
        # Ubuntu 24.04 restricts them; AppImage packaging fails without them.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
      - name: Build unsigned packages with fake updater signatures
        run: python3 scripts/ci/plan.py run research-desktop-linux
      - name: Upload the packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maple-linux-pr
          path: |
            apps/maple-research/frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/maple-research/frontend/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            apps/maple-research/frontend/src-tauri/target/release/bundle/deb/*.deb
            apps/maple-research/frontend/src-tauri/target/release/bundle/deb/*.deb.sig
            apps/maple-research/frontend/src-tauri/target/release/bundle/rpm/*.rpm
            apps/maple-research/frontend/src-tauri/target/release/bundle/rpm/*.rpm.sig
            apps/maple-research/frontend/src-tauri/target/reproducibility/desktop-pr-linux-fake-updater.pub
            apps/maple-research/frontend/src-tauri/target/reproducibility/desktop-pr-linux-*.sha256
          retention-days: 5

  # No cache: desktop-build.yml writes the Windows one to GitHub's store, which
  # a Blacksmith runner cannot read.
  research-desktop-windows:
    name: research-desktop-windows
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes)['research-desktop-windows']
    runs-on: ${{ vars.CI_WINDOWS_RUNNER || 'blacksmith-8vcpu-windows-2025' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: 1.3.5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable action, exact toolchain below
        with:
          toolchain: 1.94.1 # desktop-build.yml's Windows toolchain
      - name: Build the unsigned installer
        run: python3 scripts/ci/plan.py run research-desktop-windows
      - name: Upload the installer and its proofs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maple-windows-x64-pr
          path: |
            apps/maple-research/frontend/src-tauri/target/release/bundle/nsis/*.exe
            apps/maple-research/frontend/src-tauri/target/release/maple.exe
            apps/maple-research/frontend/src-tauri/resources/windows/*.dll
            apps/maple-research/frontend/src-tauri/target/reproducibility/desktop-pr-windows-*.sha256
          retention-days: 5

  research-desktop-windows-verify:
    name: research-desktop-windows-verify
    needs: [plan, research-desktop-windows]
    if: fromJSON(needs.plan.outputs.lanes)['research-desktop-windows-verify']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: Download the installer and its proofs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: maple-windows-x64-pr
          path: artifacts
      - name: Verify the reproducibility proofs
        run: python3 scripts/ci/plan.py run research-desktop-windows-verify

  research-dev-macos:
    name: research-dev-macos
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes)['research-dev-macos']
    runs-on: ${{ vars.CI_MACOS_RUNNER || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The package's evidence names the exact PR head, not the merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select pinned Xcode
        run: python3 scripts/ci/select-xcode.py
      - uses: ./.github/actions/setup-nix
      - name: Build the unsigned Research Dev app
        run: python3 scripts/ci/plan.py run research-dev-macos
      - name: Upload the Dev package and its identity proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maple-research-dev-macos-pr
          path: |
            apps/maple-research/frontend/src-tauri/target/research-dev/maple-research-dev-macos.tar.gz
            apps/maple-research/frontend/src-tauri/target/research-dev/build-profile.json
          if-no-files-found: error
          retention-days: 5

  ci-ok:
    name: ci-ok
    if: always()
    needs: [plan, nix, windows, agent-package-linux, agent-package-macos, agent-package-windows, research-rust,
            research-ios, research-desktop-macos, research-desktop-linux, research-desktop-windows,
            research-desktop-windows-verify, research-dev-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every selected lane succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          LANES: ${{ needs.plan.outputs.lanes }}
          NIX: ${{ needs.plan.outputs.nix }}
          WINDOWS: ${{ needs.plan.outputs.windows }}
        run: |
          set -euo pipefail
          if [ "$(jq -r '.plan.result' <<<"$NEEDS")" != success ]; then
            echo "::error::plan did not succeed"; exit 1
          fi
          # Selected => success; an unselected job may only be skipped (or succeed).
          jq -n -e --argjson needs "$NEEDS" --argjson lanes "$LANES" --argjson nix "$NIX" --argjson windows "$WINDOWS" '
            def ok($job; $selected):
              if $selected then $needs[$job].result == "success"
              else ($needs[$job].result | IN("skipped", "success")) end;
            ok("nix"; ($nix | length) > 0) and ok("windows"; ($windows | length) > 0)
            and ([$needs | keys[] | select(IN("plan", "nix", "windows") | not)]
                 | all(. as $job | ok($job; $lanes[$job] // false)))
          ' >/dev/null || { echo "::error::a selected lane did not succeed"; exit 1; }
          echo "ci-ok: every selected lane succeeded"
