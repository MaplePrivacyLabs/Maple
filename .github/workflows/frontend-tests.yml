name: Frontend Tests

permissions:
  contents: read

on:
  push:
    branches: [ master ]
    paths:
      - ".github/workflows/frontend-tests.yml"
      - "apps/maple-research/frontend/**"
      - "!apps/maple-research/frontend/src-tauri/**"
      - "scripts/prepare-frontend-deps.sh"
      - "scripts/prepare-typescript-sdk.sh"
      - "scripts/ci/_common.sh"
      - "scripts/ci/frontend.sh"
      - "flake.nix"
      - "flake.lock"
  pull_request:
    branches: [ master ]
    paths:
      - ".github/workflows/frontend-tests.yml"
      - "apps/maple-research/frontend/**"
      - "!apps/maple-research/frontend/src-tauri/**"
      - "scripts/prepare-frontend-deps.sh"
      - "scripts/prepare-typescript-sdk.sh"
      - "scripts/ci/_common.sh"
      - "scripts/ci/frontend.sh"
      - "flake.nix"
      - "flake.lock"

jobs:
  test-frontend:
    runs-on: ubuntu-latest-8-cores
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # was v22
        with:
          github-token: ""

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # was v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/maple-research/frontend/bun.lock', 'sdk/bun.lock') }}

      - name: Run frontend checks
        run: nix develop --no-update-lock-file .#ci -c ./scripts/ci/frontend.sh
