name: macOS Blacksmith compatibility trial

on:
  pull_request:
    paths:
      - .github/workflows/macos-blacksmith-trial.yml

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Record unsigned runner compatibility
        run: |
          set -euo pipefail
          uname -m
          sw_vers
          sysctl -n hw.ncpu hw.memsize
          df -h /
          ls -d /Applications/Xcode*.app
          for developer in /Applications/Xcode*.app/Contents/Developer; do
            DEVELOPER_DIR="$developer" xcodebuild -version
          done

      - name: Select existing pinned Xcode
        run: python3 scripts/ci/select-xcode.py

      - name: Confirm active toolchain and SDKs
        run: |
          set -euo pipefail
          xcodebuild -version
          env -u DEVELOPER_DIR xcodebuild -version
          xcodebuild -showsdks
