name: OpenSecret backend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Fork PRs run only on fresh hosted runners with read-only repository access.
# This workflow never signs PCRs, builds/publishes an EIF, or deploys a service.
permissions:
  contents: read

concurrency:
  group: opensecret-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  OPENSECRET_DEV_POSTGRES: "0"
  OPENSECRET_DEV_ENV: "0"
  OPENSECRET_DEV_CONTAINERS: "0"

defaults:
  run:
    shell: bash
    working-directory: services/opensecret

jobs:
  changes:
    uses: ./.github/workflows/opensecret-change-detection.yml

  rust:
    name: OpenSecret format, lint, and tests
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
          # Nix requires revCount for recursively fetched Git inputs.
          fetch-depth: 0

      - name: Install pinned Nix environment
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          github-token: ""

      - name: Cache backend Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: services/opensecret -> target
          add-rust-environment-hash-key: "false"
          key: opensecret-${{ runner.os }}-${{ hashFiles('services/opensecret/Cargo.lock', 'services/opensecret/rust-toolchain.toml', 'services/opensecret/flake.lock') }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Check formatting
        run: nix develop --no-update-lock-file '.?submodules=1' -c cargo fmt --all -- --check

      - name: Lint all backend targets and features
        run: nix develop --no-update-lock-file '.?submodules=1' -c cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run backend tests
        run: nix develop --no-update-lock-file '.?submodules=1' -c cargo test --locked --all-features

  nix:
    name: OpenSecret Nix checks and application package
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.nix != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
          # Nix requires revCount for recursively fetched Git inputs.
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          github-token: ""

      - name: Check the component flake on this host
        run: nix flake check --no-update-lock-file --print-build-logs '.?submodules=1'

      - name: Build the application package
        run: nix build --no-link --no-update-lock-file '.?submodules=1#default'

  audit:
    name: OpenSecret RustSec advisories and malicious crates
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.audit != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Check inherited OpenSecret advisory and incident policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          rust-version: 1.90.0
          manifest-path: services/opensecret/Cargo.toml
          command: check advisories bans
          arguments: --config services/opensecret/deny.toml --all-features --locked
