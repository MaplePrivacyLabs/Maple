name: OpenSecret EIF release

# Builds one environment's EIF candidate, attests it, and, behind the
# reviewer-gated pcr-signing environment, signs and appends the approval with
# the same recipe operators use. The result is a review branch for an ordinary
# pull request. This workflow never creates a GitHub Release or tag:
# /releases/latest and the desktop updater metadata belong to the Maple app.
# Legacy mirror publication and deployment stay manual.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Measurement set to build and approve
        type: choice
        options: [dev, prod]
        required: true
      dry_run:
        description: Build, attest and compare only; uncheck to sign after environment approval
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: opensecret-eif-release-${{ inputs.environment }}
  cancel-in-progress: false

env:
  EIF_MODE: ${{ inputs.environment }}
  OPENSECRET_DEV_POSTGRES: "0"
  OPENSECRET_DEV_ENV: "0"
  OPENSECRET_DEV_CONTAINERS: "0"

jobs:
  build:
    name: Build and attest EIF (${{ inputs.environment }})
    # Only the reviewed default branch can produce an approval candidate.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm64-8core
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      approval_needed: ${{ steps.build.outputs.approval_needed }}
      pcr0: ${{ steps.build.outputs.pcr0 }}
      eif_sha256: ${{ steps.build.outputs.eif_sha256 }}
      artifact: ${{ steps.build.outputs.artifact }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Install pinned Determinate Nix for FlakeHub authentication
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: true
          github-token: ""

      - name: Reuse FlakeHub and warm the branch-scoped GitHub cache
        uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3
        with:
          use-gha-cache: enabled
          diff-store: true

      - name: Build the EIF candidate and compare approved measurements
        id: build
        run: bash scripts/ci/build_opensecret_eif.sh "$EIF_MODE" eif-artifact

      - name: Upload the immutable EIF candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: eif-artifact
          if-no-files-found: error
          retention-days: 90

      - name: Attest the EIF candidate
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # v4
        with:
          subject-checksums: eif-artifact/SHA256SUMS

  sign:
    name: Sign and append approval (${{ inputs.environment }})
    needs: build
    if: inputs.dry_run == false && needs.build.outputs.approval_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewer approval and the master-only branch policy live on the
    # environment; the only secret it holds is a read-only BWS machine token.
    environment: pcr-signing
    permissions:
      contents: write
    env:
      APPROVAL_ARTIFACT: ${{ needs.build.outputs.artifact }}
      EXPECTED_EIF_SHA256: ${{ needs.build.outputs.eif_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Install pinned Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
          github-token: ""

      - name: Download the attested EIF candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.APPROVAL_ARTIFACT }}
          path: eif-artifact

      - name: Resolve the existing signing key from Bitwarden Secrets Manager
        id: signing-key
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.OPENSECRET_PCR_SIGNING_BWS_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.OPENSECRET_PCR_SIGNING_KEY_ID }} > SIGNING_PRIVATE_KEY
          set_env: false

      - name: Sign PCR0 and append the verified approval
        env:
          SIGNING_PRIVATE_KEY: ${{ steps.signing-key.outputs.SIGNING_PRIVATE_KEY }}
        run: nix develop --no-update-lock-file './services/opensecret?submodules=1#signing' -c bash services/opensecret/scripts/ci_sign_pcr.sh "$EIF_MODE" eif-artifact

      - name: Push the approval branch for review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/publish_opensecret_approval.sh "$EIF_MODE" eif-artifact
