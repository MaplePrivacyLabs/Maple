name: OpenSecret EIF release

# Builds and attests one environment's EIF candidate. Approval happens in the
# corresponding opensecret-release-statement workflow, where one reviewer-gated
# job signs both the legacy PCR0 approval and the Sigstore release statement.
# Deployment stays manual; this workflow never creates a Release or tag.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Measurement set to build
        type: choice
        options: [dev, prod]
        required: true

permissions:
  contents: read

concurrency:
  group: opensecret-eif-release-${{ inputs.environment }}
  cancel-in-progress: false

env:
  EIF_MODE: ${{ inputs.environment }}
  OPENSECRET_DEV_POSTGRES: "0"
  OPENSECRET_DEV_ENV: "0"
  OPENSECRET_DEV_CONTAINERS: "0"

jobs:
  build:
    name: Build and attest EIF (${{ inputs.environment }})
    # Only the reviewed default branch can produce an approval candidate.
    if: github.ref == 'refs/heads/master'
    runs-on: blacksmith-16vcpu-ubuntu-2404-arm
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      approval_needed: ${{ steps.build.outputs.approval_needed }}
      pcr0: ${{ steps.build.outputs.pcr0 }}
      eif_sha256: ${{ steps.build.outputs.eif_sha256 }}
      artifact: ${{ steps.build.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Install pinned Determinate Nix for FlakeHub authentication
        uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
        with:
          source-tag: v3.24.2
          github-token: ""

      - name: Verify pinned Nix runtime
        run: bash scripts/ci/verify-nix-runtime.sh

      - name: Reuse FlakeHub with an Actions cache fallback
        uses: DeterminateSystems/flakehub-cache-action@f00fba8dc0949d63cbbb7d33da7912417d588d75 # v3.24.2
        with:
          diff-store: true

      - name: Build the EIF candidate and compare approved measurements
        id: build
        run: bash scripts/ci/build_opensecret_eif.sh "$EIF_MODE" eif-artifact

      - name: Upload the immutable EIF candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: eif-artifact
          if-no-files-found: error
          retention-days: 90

      - name: Attest the EIF candidate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: eif-artifact/SHA256SUMS
