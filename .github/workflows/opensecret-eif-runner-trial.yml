name: OpenSecret EIF runner trial

# Temporary PR-only validation. Remove after collecting sizing evidence.
on:
  pull_request:
    branches: [master]
    paths: [.github/workflows/opensecret-eif-runner-trial.yml]

permissions:
  contents: read

concurrency:
  group: opensecret-eif-runner-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      OPENSECRET_DEV_POSTGRES: "0"
      OPENSECRET_DEV_ENV: "0"
      OPENSECRET_DEV_CONTAINERS: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Compare the exact deployed source, independent of this diagnostic PR.
          ref: 1a9df324d7689444528f9a915977273009c10d6a
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Record actual runner capacity
        run: |
          nproc
          free --mebi
          df -h /
      - name: Install pinned Determinate Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
        with:
          determinate: true
          github-token: ""
      - name: Reuse the existing trusted cache
        uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea
        with:
          diff-store: true
      - name: Realize the reviewed backend output
        run: nix build --no-update-lock-file --no-link --print-build-logs './services/opensecret?submodules=1#default'
      - name: Recompile the backend and compare its output
        # --rebuild checks against the realized output without evicting any cache.
        run: nix build --no-update-lock-file --rebuild --no-link --print-build-logs './services/opensecret?submodules=1#default'
      - name: Verify both EIFs against the deployed release
        run: |
          trial_source_sha=$(git rev-parse HEAD)
          GITHUB_SHA="$trial_source_sha" bash scripts/ci/build_opensecret_eif.sh dev "$RUNNER_TEMP/trial-dev"
          GITHUB_SHA="$trial_source_sha" bash scripts/ci/build_opensecret_eif.sh prod "$RUNNER_TEMP/trial-prod"
          test "$(jq -r .eif_sha256 "$RUNNER_TEMP/trial-dev/handoff.json")" = b400c2ac0d5d32a8ce3f6fe71964d939b334bc61a41ae7481aca452223555a9b
          test "$(jq -r .eif_sha256 "$RUNNER_TEMP/trial-prod/handoff.json")" = 5ed9b5819396c84a531ad2c0fe1da6d71c53a15d8f7de5a48a77a45e0203125d
          test "$(jq -r .approval_needed "$RUNNER_TEMP/trial-dev/handoff.json")" = false
          test "$(jq -r .approval_needed "$RUNNER_TEMP/trial-prod/handoff.json")" = false
          df -h / /nix
