name: OpenSecret EIF approval checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cache writes are not PCR approval, release publication, or deployment.
# OIDC is limited to master and same-repository PRs in the trusted job below.
permissions:
  contents: read

concurrency:
  group: opensecret-eif-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/opensecret-change-detection.yml

  eif:
    name: EIF/PCR approval match (${{ matrix.mode }})
    needs: changes
    # PR comparison requires an actual edit to one of the four approval files.
    # A selector failure fails the changes job, not a speculative PCR comparison.
    if: >-
      ${{
        always() && !cancelled() &&
        (
          (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master') ||
          (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository &&
            needs.changes.result == 'success' &&
            needs.changes.outputs.pcr_approvals == 'true')
        )
      }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [dev, prod]
    env:
      EIF_MODE: ${{ matrix.mode }}
      OPENSECRET_DEV_POSTGRES: "0"
      OPENSECRET_DEV_ENV: "0"
      OPENSECRET_DEV_CONTAINERS: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Install pinned Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
          github-token: ""

      # Fork PRs cannot authenticate to FlakeHub. GitHub scopes cache writes
      # to the PR merge ref; those entries cannot populate master's cache.
      - name: Reuse branch-scoped Nix cache without FlakeHub credentials
        uses: DeterminateSystems/magic-nix-cache-action@3c034b51a9deec0a09ef1df8b436ac5db50fae94
        with:
          source-revision: 4cc363589df8090801c098cdcde1bdd42562318a
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Build EIF and compare approved measurements
        shell: bash
        run: bash scripts/ci/check_opensecret_eif.sh "$EIF_MODE"

  eif-trusted:
    name: EIF/PCR approval match (trusted, ${{ matrix.mode }})
    needs: changes
    # Trust the PR's head repository, not its branch name or author's association.
    # Forks and missing head-repository metadata stay in the unprivileged job.
    if: >-
      ${{
        always() && !cancelled() &&
        (
          (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            needs.changes.result == 'success' &&
            needs.changes.outputs.pcr_approvals == 'true') ||
          (github.ref == 'refs/heads/master' &&
            (
              github.event_name == 'workflow_dispatch' ||
              (github.event_name == 'push' &&
                (needs.changes.result != 'success' || needs.changes.outputs.eif != 'false'))
            ))
        )
      }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04-arm64-8core
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        mode: [dev, prod]
    env:
      EIF_MODE: ${{ matrix.mode }}
      OPENSECRET_DEV_POSTGRES: "0"
      OPENSECRET_DEV_ENV: "0"
      OPENSECRET_DEV_CONTAINERS: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Install pinned Determinate Nix for FlakeHub authentication
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: true
          github-token: ""

      - name: Reuse FlakeHub and warm the branch-scoped GitHub cache
        uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3
        with:
          # Enable both, not the default fallback-only GitHub cache.
          use-gha-cache: enabled
          # Also cache substituted paths, such as the FlakeHub kernel hit,
          # so master runs warm the default-branch cache for fork PRs.
          diff-store: true

      - name: Build EIF and compare approved measurements
        shell: bash
        run: bash scripts/ci/check_opensecret_eif.sh "$EIF_MODE"
