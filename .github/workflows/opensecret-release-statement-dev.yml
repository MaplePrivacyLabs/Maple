name: OpenSecret Dev release statement

# This file is a client trust anchor. Every job must remain reviewer-gated:
# a certificate identifies the workflow file/ref, not a particular job.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful master OpenSecret EIF release run built for Dev
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: opensecret-eif-release-dev
  cancel-in-progress: false

jobs:
  sign:
    if: github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pcr-signing-dev
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      OPENSECRET_DEV_POSTGRES: "0"
      OPENSECRET_DEV_ENV: "0"
      OPENSECRET_DEV_CONTAINERS: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - uses: ./.github/actions/setup-nix

      - name: Verify the selected Dev build and prepare its predicate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: >-
          nix shell --no-update-lock-file --inputs-from . nixpkgs#python3 nixpkgs#gh
          -c python3 scripts/ci/opensecret_release_statement.py prepare "$BUILD_RUN_ID" candidate release

      - name: Resolve the existing PCR signing key
        id: signing-key
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.OPENSECRET_PCR_SIGNING_BWS_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.OPENSECRET_PCR_SIGNING_KEY_ID }} > SIGNING_PRIVATE_KEY
          set_env: false

      - name: Sign the same candidate for legacy clients
        env:
          SIGNING_PRIVATE_KEY: ${{ steps.signing-key.outputs.SIGNING_PRIVATE_KEY }}
          EXPECTED_EIF_SHA256: ${{ steps.candidate.outputs.eif_sha256 }}
        run: nix develop --no-update-lock-file './services/opensecret?submodules=1#signing' -c bash services/opensecret/scripts/ci_sign_pcr.sh dev candidate

      - name: Sign the reviewed Dev release statement
        id: statement
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # v4
        with:
          subject-path: candidate/image.eif
          predicate-type: https://maple.ai/attestations/enclave-release/v1
          predicate-path: release/predicate.json

      - name: Verify and retain the original approval bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.statement.outputs.bundle-path }}
        run: >-
          nix shell --no-update-lock-file --inputs-from . nixpkgs#python3 nixpkgs#gh
          -c python3 scripts/ci/opensecret_release_statement.py retain candidate release "$BUNDLE_PATH"

      - name: Retain the EIF and its original approval for exact-digest rollback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opensecret-approved-dev-${{ inputs.build_run_id }}-${{ github.run_id }}
          path: |
            candidate
            release
          if-no-files-found: error
          retention-days: 90

      - name: Resolve only this environment's R2 publisher credentials
        id: publisher
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.ATTESTATIONS_PUBLISH_BWS_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.ATTESTATIONS_R2_ACCESS_KEY_ID_SECRET_ID }} > AWS_ACCESS_KEY_ID
            ${{ vars.ATTESTATIONS_R2_SECRET_ACCESS_KEY_SECRET_ID }} > AWS_SECRET_ACCESS_KEY
          set_env: false

      - name: Publish and independently verify the public bytes
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ steps.publisher.outputs.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.publisher.outputs.AWS_SECRET_ACCESS_KEY }}
          ATTESTATIONS_R2_ACCOUNT_ID: ${{ vars.ATTESTATIONS_R2_ACCOUNT_ID }}
          ATTESTATIONS_R2_BUCKET: ${{ vars.ATTESTATIONS_R2_BUCKET }}
        run: >-
          nix shell --no-update-lock-file --inputs-from . nixpkgs#python3 nixpkgs#gh nixpkgs#awscli2
          -c python3 scripts/ci/opensecret_release_statement.py publish candidate release

      - name: Push the ordinary legacy approval branch for review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
        run: bash scripts/ci/publish_opensecret_approval.sh dev candidate
