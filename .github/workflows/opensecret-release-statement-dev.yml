name: OpenSecret Dev release statement

# Approves one verified Dev EIF build. Its single reviewer-gated job signs the
# Sigstore release statement with the Dev KMS key and the legacy PCR0 approval
# with the existing key, so one review covers both; publishes the bundle to the
# Dev attestation host; and pushes the legacy approval branch for review. The
# environment, key, bucket and host are fixed here, never inputs. See
# services/opensecret/docs/release-statements.md.

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run ID of a successful master OpenSecret EIF release run built for dev
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: opensecret-release-statement-dev
  cancel-in-progress: false

jobs:
  sign:
    name: Verify, sign and publish the Dev release statement
    if: github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Required reviewers and the master-only branch rule live on the environment.
    # It also scopes the AWS role (its OIDC subject names this environment) and
    # holds this environment's BWS machine tokens.
    environment: pcr-signing-dev
    permissions:
      contents: write
      actions: read
      attestations: read
      id-token: write
    env:
      OPENSECRET_DEV_POSTGRES: "0"
      OPENSECRET_DEV_ENV: "0"
      OPENSECRET_DEV_CONTAINERS: "0"
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      # The Dev approval key, by full ARN (never an alias), and the only role its
      # policy lets sign. The preflight step fails the job while these are
      # placeholders or the reviewed public key below is not committed.
      SIGNING_KEY_ARN: arn:aws:kms:us-east-1:REPLACE_ME_SIGNING_ACCOUNT_ID:key/REPLACE_ME_DEV_KEY_ID
      SIGNER_ROLE_ARN: arn:aws:iam::REPLACE_ME_SIGNING_ACCOUNT_ID:role/maple-pcr-signer-dev
      SIGNING_PUBLIC_KEY: scripts/ci/opensecret-release/dev-signing-key.pem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - uses: ./.github/actions/setup-nix

      - name: Refuse to run with an incomplete signing identity
        run: >-
          nix shell --no-update-lock-file --inputs-from . nixpkgs#python3
          -c python3 -I scripts/ci/opensecret_release_statement.py preflight dev

      - name: Verify the selected Dev build and prepare its statement
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          nix shell --no-update-lock-file --inputs-from . nixpkgs#python3 nixpkgs#gh
          -c python3 -I scripts/ci/opensecret_release_statement.py prepare dev "$BUILD_RUN_ID" candidate release

      - name: Install the pinned Cosign release
        run: >-
          nix shell --no-update-lock-file --inputs-from . nixpkgs#python3
          -c python3 -I scripts/ci/opensecret_release_statement.py install-cosign "$RUNNER_TEMP/cosign"

      - name: Resolve the existing PCR signing key
        id: signing-key
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.OPENSECRET_PCR_SIGNING_BWS_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.OPENSECRET_PCR_SIGNING_KEY_ID }} > SIGNING_PRIVATE_KEY
          set_env: false

      - name: Sign the same candidate for legacy clients
        env:
          SIGNING_PRIVATE_KEY: ${{ steps.signing-key.outputs.SIGNING_PRIVATE_KEY }}
          EXPECTED_EIF_SHA256: ${{ steps.candidate.outputs.eif_sha256 }}
        run: nix develop --no-update-lock-file './services/opensecret?submodules=1#signing' -c bash services/opensecret/scripts/ci_sign_pcr.sh dev candidate

      - name: Sign the release statement with the Dev KMS key
        run: >-
          nix shell --no-update-lock-file --inputs-from . nixpkgs#python3
          -c python3 -I scripts/ci/opensecret_release_statement.py sign dev candidate release "$RUNNER_TEMP/cosign/cosign"

      - name: Retain the EIF with its original bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opensecret-approved-dev-${{ steps.candidate.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate
            release
          if-no-files-found: error
          retention-days: 90

      - name: Resolve the Dev bucket publisher credential
        id: publisher
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.ATTESTATIONS_R2_BWS_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.ATTESTATIONS_R2_ACCESS_KEY_ID_SECRET_ID }} > AWS_ACCESS_KEY_ID
            ${{ vars.ATTESTATIONS_R2_SECRET_ACCESS_KEY_SECRET_ID }} > AWS_SECRET_ACCESS_KEY
          set_env: false

      - name: Publish the bundle and verify the public bytes
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.publisher.outputs.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.publisher.outputs.AWS_SECRET_ACCESS_KEY }}
          ATTESTATIONS_R2_ACCOUNT_ID: ${{ vars.ATTESTATIONS_R2_ACCOUNT_ID }}
          ATTESTATIONS_R2_BUCKET: ${{ vars.ATTESTATIONS_R2_BUCKET }}
        run: >-
          nix shell --no-update-lock-file --inputs-from . nixpkgs#python3 nixpkgs#awscli2
          -c python3 -I scripts/ci/opensecret_release_statement.py publish dev candidate release "$RUNNER_TEMP/cosign/cosign"

      - name: Push the legacy approval branch for review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
        run: bash scripts/ci/publish_opensecret_approval.sh dev candidate
