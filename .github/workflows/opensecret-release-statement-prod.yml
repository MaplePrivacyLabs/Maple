name: OpenSecret Production release statement
# Shown on the run list and the reviewer's approval screen, so the reviewer can
# see which build they are approving.
run-name: Production release statement for build run ${{ inputs.build_run_id }}

# Approves one verified Production EIF build. Its single reviewer-gated job signs the
# Sigstore release statement with the Production KMS key and the legacy PCR0 approval
# with the existing key, so one review covers both; publishes the bundle to the
# Production attestation host; and pushes the legacy approval branch for review. The
# environment and key are fixed here; bucket and host are fixed per mode in
# scripts/ci/opensecret_release_statement.py. None are inputs. See
# services/opensecret/docs/release-statements.md.

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run ID of a successful master OpenSecret EIF release run built for prod
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: opensecret-release-statement-prod
  cancel-in-progress: false

jobs:
  sign:
    name: Verify, sign and publish the Production release statement
    if: github.repository == 'MaplePrivacyLabs/Maple' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Required reviewers and the master-only branch rule live on the environment.
    # It also scopes the AWS role (its OIDC subject names this environment) and
    # holds this environment's own BWS machine token, which reads only the legacy
    # signing key and the Production bucket's publisher credential.
    environment: pcr-signing-prod
    permissions:
      contents: write
      actions: read
      attestations: read
      id-token: write
    env:
      OPENSECRET_DEV_POSTGRES: "0"
      OPENSECRET_DEV_ENV: "0"
      OPENSECRET_DEV_CONTAINERS: "0"
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      # The Production approval key, by full ARN (never an alias), and the only role its
      # policy lets sign. The preflight step fails the job while these are
      # placeholders or the reviewed public key below is not committed.
      SIGNING_KEY_ARN: REPLACE_ME_PROD_KMS_KEY_ARN
      SIGNER_ROLE_ARN: REPLACE_ME_PROD_SIGNER_ROLE_ARN
      SIGNING_PUBLIC_KEY: scripts/ci/opensecret-release/prod-signing-key.pem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - uses: ./.github/actions/setup-nix

      - name: Check the signing identity and public storage settings
        env:
          ATTESTATIONS_R2_ACCOUNT_ID: ${{ vars.ATTESTATIONS_R2_ACCOUNT_ID }}
          ATTESTATIONS_R2_BUCKET: ${{ vars.ATTESTATIONS_R2_BUCKET }}
        run: >-
          nix shell --no-update-lock-file --inputs-from . nixpkgs#python3 nixpkgs#yq-go
          -c python3 -I scripts/ci/opensecret_release_statement.py preflight prod

      - name: Verify the selected Production build and prepare its statement
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          nix shell --no-update-lock-file --inputs-from . nixpkgs#python3 nixpkgs#gh
          -c python3 -I scripts/ci/opensecret_release_statement.py prepare prod "$BUILD_RUN_ID" candidate release

      - name: Install the pinned Cosign release
        run: >-
          nix shell --no-update-lock-file --inputs-from . nixpkgs#python3
          -c python3 -I scripts/ci/opensecret_release_statement.py install-cosign "$RUNNER_TEMP/cosign"

      - name: Resolve the Production bucket publisher credential
        id: publisher
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.OPENSECRET_PCR_SIGNING_BWS_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.ATTESTATIONS_R2_ACCESS_KEY_ID_SECRET_ID }} > AWS_ACCESS_KEY_ID
            ${{ vars.ATTESTATIONS_R2_SECRET_ACCESS_KEY_SECRET_ID }} > AWS_SECRET_ACCESS_KEY
          set_env: false

      - name: Resolve the existing PCR signing key
        id: signing-key
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.OPENSECRET_PCR_SIGNING_BWS_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.OPENSECRET_PCR_SIGNING_KEY_ID }} > SIGNING_PRIVATE_KEY
          set_env: false

      - name: Sign the same candidate for legacy clients
        env:
          SIGNING_PRIVATE_KEY: ${{ steps.signing-key.outputs.SIGNING_PRIVATE_KEY }}
          EXPECTED_EIF_SHA256: ${{ steps.candidate.outputs.eif_sha256 }}
        run: nix develop --no-update-lock-file './services/opensecret?submodules=1#signing' -c bash services/opensecret/scripts/ci_sign_pcr.sh prod candidate

      - name: Sign the release statement with the Production KMS key
        run: >-
          nix shell --no-update-lock-file --inputs-from . nixpkgs#python3 nixpkgs#yq-go
          -c python3 -I scripts/ci/opensecret_release_statement.py sign prod candidate release "$RUNNER_TEMP/cosign/cosign"

      - name: Retain the EIF with its original bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opensecret-approved-prod-${{ steps.candidate.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate
            release
          if-no-files-found: error
          retention-days: 90

      - name: Publish the bundle and verify the public bytes
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.publisher.outputs.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.publisher.outputs.AWS_SECRET_ACCESS_KEY }}
          ATTESTATIONS_R2_ACCOUNT_ID: ${{ vars.ATTESTATIONS_R2_ACCOUNT_ID }}
          ATTESTATIONS_R2_BUCKET: ${{ vars.ATTESTATIONS_R2_BUCKET }}
        run: >-
          nix shell --no-update-lock-file --inputs-from . nixpkgs#python3 nixpkgs#awscli2
          -c python3 -I scripts/ci/opensecret_release_statement.py publish prod candidate release "$RUNNER_TEMP/cosign/cosign"

      - name: Push the legacy approval branch for review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
        run: nix develop --no-update-lock-file './services/opensecret?submodules=1#signing' -c bash scripts/ci/publish_opensecret_approval.sh prod candidate
