name: Pages preview build

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/web-build.yml"
      - ".github/workflows/pages-*.yml"
      - "apps/maple-research/frontend/**"
      - "!apps/maple-research/frontend/src-tauri/**"
      - "sdk/src/**"
      - "!sdk/src/lib/test/**"
      - "sdk/bun.lock"
      - "sdk/bunfig.toml"
      - "sdk/package.json"
      - "sdk/tsconfig.build.json"
      - "sdk/tsconfig.json"
      - "sdk/vite.config.ts"
      - "scripts/prepare-frontend-deps.sh"
      - "scripts/prepare-typescript-sdk.sh"
      - "scripts/ci/_common.sh"
      - "scripts/ci/web.sh"
      - "scripts/ci/pages_*.py"
      - "scripts/ci/test_pages_*.py"
      - "flake.nix"
      - "flake.lock"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/web-build.yml"
      - ".github/workflows/pages-*.yml"
      - "apps/maple-research/frontend/**"
      - "!apps/maple-research/frontend/src-tauri/**"
      # Older open PR heads retain their development preview until rebased.
      - "frontend/**"
      - "!frontend/src-tauri/**"
      - "sdk/src/**"
      - "!sdk/src/lib/test/**"
      - "sdk/bun.lock"
      - "sdk/bunfig.toml"
      - "sdk/package.json"
      - "sdk/tsconfig.build.json"
      - "sdk/tsconfig.json"
      - "sdk/vite.config.ts"
      - "scripts/prepare-frontend-deps.sh"
      - "scripts/prepare-typescript-sdk.sh"
      - "scripts/ci/_common.sh"
      - "scripts/ci/web.sh"
      - "scripts/ci/pages_*.py"
      - "scripts/ci/test_pages_*.py"
      - "flake.nix"
      - "flake.lock"

jobs:
  build-preview:
    # Untrusted PR code runs here without deployment credentials or write permissions.
    # Fork PRs retain their existing CI checks, but do not get a hosted Pages preview.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout preview source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Checkout workflow tooling
        # Older PR heads may not contain the deployment tooling yet. This is the
        # unprivileged workflow/merge SHA; the publisher still distrusts its output.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: .pages-tools
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          github-token: ""

      - name: Build with development services
        run: nix develop --no-update-lock-file .#ci -c ./scripts/ci/web.sh
        env:
          MAPLE_WEB_ENVIRONMENT: pr
          MAPLE_IOS_DEV_AUTH_ORIGIN: ${{ vars.MAPLE_IOS_DEV_AUTH_ORIGIN }}

      - name: Describe the preview artifact
        id: artifact
        run: |
          set -euo pipefail
          # Existing PR heads may still use the pre-relocation source layout.
          # Accept exactly one known output location; never search arbitrary paths.
          artifact_dir=""
          for candidate in apps/maple-research/frontend/src-tauri/target/reproducibility frontend/src-tauri/target/reproducibility; do
            if [ -f "$candidate/maple-web-dist.tar.gz" ]; then
              [ -z "$artifact_dir" ] || { echo "Ambiguous preview artifact layout" >&2; exit 1; }
              artifact_dir="$candidate"
            fi
          done
          [ -n "$artifact_dir" ] || { echo "Missing preview artifact" >&2; exit 1; }
          nix develop --no-update-lock-file "$GITHUB_WORKSPACE/.pages-tools#pages" \
            -c python3 -I "$GITHUB_WORKSPACE/.pages-tools/scripts/ci/pages_artifact.py" manifest \
            --archive "$artifact_dir/maple-web-dist.tar.gz" \
            --profile pr \
            --sha "$SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$artifact_dir/pages-artifact.json"
          printf 'directory=%s\n' "$artifact_dir" >> "$GITHUB_OUTPUT"

      - name: Upload the preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maple-pages-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.artifact.outputs.directory }}/maple-web-dist.tar.gz
            ${{ steps.artifact.outputs.directory }}/pages-artifact.json
          if-no-files-found: error
          retention-days: 5
