name: Pages production build

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout production web source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""
          # HTTP/2 stream resets from cache.nixos.org make Nix resume past
          # the end of a NAR (HTTP 416); HTTP/1.1 avoids the resets.
          extra-conf: http2 = false

      - name: Verify pinned Nix runtime
        run: bash scripts/ci/verify-nix-runtime.sh

      - name: Test Pages artifact and deployment boundaries
        run: nix build --no-update-lock-file --no-link --print-build-logs .#checks.x86_64-linux.pages

      - name: Build web with production services
        env:
          MAPLE_WEB_ENVIRONMENT: release
        run: nix develop --no-update-lock-file .#ci -c bash scripts/ci/web.sh

      - name: Describe the production web artifact
        run: |
          set -euo pipefail
          artifact_dir="apps/maple-research/frontend/src-tauri/target/reproducibility"
          nix develop --no-update-lock-file .#pages -c python3 -I scripts/ci/pages_artifact.py manifest \
            --archive "$artifact_dir/maple-web-dist.tar.gz" \
            --profile release \
            --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$artifact_dir/pages-artifact.json"

      - name: Upload the production web artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maple-pages-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/maple-research/frontend/src-tauri/target/reproducibility/maple-web-dist.tar.gz
            apps/maple-research/frontend/src-tauri/target/reproducibility/pages-artifact.json
          if-no-files-found: error
          retention-days: 5
