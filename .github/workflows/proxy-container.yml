name: Proxy container CI

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/proxy-container.yml"
      - ".github/workflows/proxy-publish.yml"
      - ".dockerignore"
      - "proxy/Dockerfile"
      - "proxy/Cargo.toml"
      - "proxy/Cargo.lock"
      - "proxy/src/**"
  pull_request:
    paths:
      - ".github/workflows/proxy-container.yml"
      - ".github/workflows/proxy-publish.yml"
      - ".dockerignore"
      - "proxy/Dockerfile"
      - "proxy/Cargo.toml"
      - "proxy/Cargo.lock"
      - "proxy/src/**"

jobs:
  proxy-container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # was v3

      - name: Build proxy container without publishing
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # was v5
        with:
          context: .
          file: proxy/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=proxy-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=proxy-${{ matrix.platform }}
          push: false
