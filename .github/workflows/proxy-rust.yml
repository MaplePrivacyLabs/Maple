name: Proxy Rust CI

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/proxy-rust.yml"
      - "proxy/Cargo.toml"
      - "proxy/Cargo.lock"
      - "proxy/clippy.toml"
      - "proxy/flake.nix"
      - "proxy/flake.lock"
      - "proxy/rust-toolchain.toml"
      - "proxy/rustfmt.toml"
      - "proxy/src/**"
      - "proxy/tests/**"
      - "proxy/examples/**"
      - "scripts/ci/proxy-release.sh"
  pull_request:
    paths:
      - ".github/workflows/proxy-rust.yml"
      - "proxy/Cargo.toml"
      - "proxy/Cargo.lock"
      - "proxy/clippy.toml"
      - "proxy/flake.nix"
      - "proxy/flake.lock"
      - "proxy/rust-toolchain.toml"
      - "proxy/rustfmt.toml"
      - "proxy/src/**"
      - "proxy/tests/**"
      - "proxy/examples/**"
      - "scripts/ci/proxy-release.sh"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  proxy-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # was v22
        with:
          github-token: ""

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # was v2
        with:
          workspaces: proxy -> target
          add-rust-environment-hash-key: "false"
          key: ${{ hashFiles('proxy/Cargo.lock', 'proxy/rust-toolchain.toml', 'proxy/flake.lock') }}

      - name: Run credential-free proxy checks
        run: |
          nix develop --no-update-lock-file ./proxy -c bash -lc '
            set -euo pipefail
            cd proxy
            cargo fmt --all -- --check
            cargo clippy --locked --all-targets --all-features -- -D warnings
            cargo test --locked --all-features
            RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features
            cargo machete
          '

  proxy-native-release:
    name: proxy-native-release (${{ matrix.archive }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            archive: maple-proxy-linux-x86_64.tar.gz
          - runner: ubuntu-24.04-arm
            archive: maple-proxy-linux-aarch64.tar.gz
          - runner: macos-26-xlarge
            archive: maple-proxy-macos-aarch64.tar.gz
          - runner: windows-2025
            archive: maple-proxy-windows-x86_64.zip
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # was stable
        with:
          toolchain: 1.89.0

      - name: Cache proxy Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # was v2
        with:
          workspaces: proxy -> target
          add-rust-environment-hash-key: "false"
          key: native-release-${{ matrix.archive }}-${{ hashFiles('proxy/Cargo.lock') }}

      - name: Rehearse native proxy release asset
        shell: bash
        run: ./scripts/ci/proxy-release.sh proxy-release-rehearsal "${{ matrix.archive }}"
