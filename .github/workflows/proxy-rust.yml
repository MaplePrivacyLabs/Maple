name: Proxy Rust CI

# Rehearses release.yml's native proxy builds (test-release-gates.sh keeps the
# two matrices equal). The proxy's own checks are ci.yml's `proxy` lane. No
# cache: three of the four runners are GitHub-hosted.
permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/proxy-rust.yml"
      - "proxy/Cargo.toml"
      - "proxy/Cargo.lock"
      - "proxy/rust-toolchain.toml"
      - "proxy/src/**"
      - "sdk/rust/Cargo.toml"
      - "sdk/rust/build.rs"
      - "sdk/rust/src/**"
      - "sdk/rust/assets/**"
      - "scripts/ci/proxy-release.sh"
  pull_request:
    # A PR that changes the release script or toolchain rehearses it before merge.
    paths:
      - ".github/workflows/proxy-rust.yml"
      - "proxy/rust-toolchain.toml"
      - "scripts/ci/proxy-release.sh"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  proxy-native-release:
    name: proxy-native-release (${{ matrix.archive }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            archive: maple-proxy-linux-x86_64.tar.gz
          - runner: ubuntu-24.04-arm
            archive: maple-proxy-linux-aarch64.tar.gz
          - runner: blacksmith-6vcpu-macos-27
            archive: maple-proxy-macos-aarch64.tar.gz
          - runner: windows-2025
            archive: maple-proxy-windows-x86_64.zip
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # was stable
        with:
          toolchain: 1.89.0

      - name: Rehearse native proxy release asset
        shell: bash
        run: ./scripts/ci/proxy-release.sh proxy-release-rehearsal "${{ matrix.archive }}"
