name: Proxy Rust supply-chain checks

on:
  pull_request:
    paths:
      - ".github/workflows/proxy-supply-chain.yml"
      - "proxy/deny.toml"
      - "proxy/Cargo.toml"
      - "proxy/Cargo.lock"
  push:
    branches: [master]
    paths:
      - ".github/workflows/proxy-supply-chain.yml"
      - "proxy/deny.toml"
      - "proxy/Cargo.toml"
      - "proxy/Cargo.lock"
  schedule:
    - cron: "29 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proxy-cargo-deny:
    name: Proxy RustSec advisories and malicious crates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          persist-credentials: false

      - name: Check proxy RustSec advisories and incident denylist
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # was v2
        with:
          manifest-path: proxy/Cargo.toml
          command: check advisories bans
          arguments: --config proxy/deny.toml --all-features --locked
