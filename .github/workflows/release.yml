name: Release

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  classify-app-release:
    name: Classify Maple app release
    # Other components have namespaced tags; only Research owns bare v* tags.
    # The existing classifier still enforces the exact vX.Y.Z format.
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.classify.outputs.tag }}
      release_sha: ${{ steps.classify.outputs.release_sha }}
      version: ${{ steps.classify.outputs.version }}
      prerelease: ${{ steps.classify.outputs.prerelease }}
      stable: ${{ steps.classify.outputs.stable }}

    steps:
      - name: Validate release event against GitHub state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_ACTION: ${{ github.event.action }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail

          fail() {
            echo "Release classification failed: $*" >&2
            exit 1
          }

          [ "${REPOSITORY_DEFAULT_BRANCH}" = "master" ] || fail "default branch must be master"
          [ "${RELEASE_ACTION}" = "created" ] || fail "event action must be created"
          [[ "${RELEASE_ID}" =~ ^[0-9]+$ ]] || fail "release id must be numeric"
          [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || \
            fail "tag must be an exact vX.Y.Z Maple app tag"
          [ "${RELEASE_DRAFT}" = "false" ] || fail "draft releases are not publishable"
          case "${RELEASE_PRERELEASE}" in
            true|false) ;;
            *) fail "prerelease must be a boolean" ;;
          esac
          [ "${RELEASE_REF}" = "refs/tags/${RELEASE_TAG}" ] || fail "release ref does not match tag"
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || fail "release SHA is invalid"
          [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]] || fail "workflow SHA is invalid"
          [ "${WORKFLOW_SHA}" = "${RELEASE_SHA}" ] || fail "workflow and release SHAs differ"

          live_default_branch="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}" \
            --jq '.default_branch')"
          [ "${live_default_branch}" = "master" ] || fail "live default branch must be master"

          release_json="$(mktemp)"
          trap 'rm -f "${release_json}"' EXIT
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/releases/${RELEASE_ID}" > "${release_json}"
          jq -e \
            --argjson id "${RELEASE_ID}" \
            --arg tag "${RELEASE_TAG}" \
            --argjson prerelease "${RELEASE_PRERELEASE}" \
            '(.id == $id)
              and (.tag_name == $tag)
              and (.draft == false)
              and (.prerelease == $prerelease)' \
            "${release_json}" > /dev/null || fail "live release no longer matches the event"

          live_tag_sha="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/commits/${RELEASE_TAG}" \
            --jq '.sha')"
          [ "${live_tag_sha}" = "${RELEASE_SHA}" ] || fail "live tag no longer resolves to the event SHA"

          compare_status="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/compare/${RELEASE_SHA}...master" \
            --jq '.status')"
          case "${compare_status}" in
            ahead|identical) ;;
            *) fail "release SHA is not reachable from protected master" ;;
          esac

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify app release
        id: classify
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          ./scripts/ci/classify-app-release.sh \
            --repo-root "${GITHUB_WORKSPACE}" \
            --tag "${RELEASE_TAG}" \
            --sha "${RELEASE_SHA}" \
            --draft "${RELEASE_DRAFT}" \
            --prerelease "${RELEASE_PRERELEASE}" \
            --ref "${RELEASE_REF}" \
            --protected-ref refs/remotes/origin/master \
            >> "${GITHUB_OUTPUT}"

  build-tauri:
    environment: desktop-signing
    needs: classify-app-release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-26-xlarge
            nix_shell: ci
            artifact_prefix: macos
          - platform: ubuntu-latest-8-cores
            nix_shell: desktop-linux
            artifact_prefix: linux

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          ref: ${{ needs.classify-app-release.outputs.release_sha }}
          persist-credentials: false

      # Xcode 26.5 is temporarily exposed as a beta app on macos-26 runners: https://github.com/actions/runner-images/issues/14108
      - name: Select Xcode 26.5
        if: startsWith(matrix.platform, 'macos-26')
        run: |
          set -euo pipefail
          for xcode_app in \
            /Applications/Xcode_26.5.0.app \
            /Applications/Xcode_26.5_beta_2.app \
            /Applications/Xcode_26.5_beta.app
          do
            if [ -x "${xcode_app}/Contents/Developer/usr/bin/xcodebuild" ]; then
              sudo xcode-select -s "${xcode_app}/Contents/Developer"
              xcodebuild -version
              exit 0
            fi
          done
          echo "Xcode 26.5 is not installed on this runner." >&2
          ls -1 /Applications/Xcode*.app >&2 || true
          exit 1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # was v22
        with:
          github-token: ""

      - name: Cache sccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # was v4
        with:
          path: ${{ startsWith(matrix.platform, 'macos') && '~/Library/Caches/Mozilla.sccache' || '~/.cache/sccache' }}
          key: ${{ runner.os }}-sccache-release-${{ hashFiles('apps/maple-research/frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-release-
            ${{ runner.os }}-sccache-

      # Ubuntu 24.04 restricts unprivileged user namespaces by default; linuxdeploy/AppImage
      # packaging uses bubblewrap and otherwise fails with "bwrap: setting up uid map: Permission denied".
      - name: Allow bubblewrap user namespaces
        if: matrix.platform == 'ubuntu-latest-8-cores'
        run: |
          set -euo pipefail
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

      - name: Build Tauri desktop app
        run: nix develop --no-update-lock-file .#${{ matrix.nix_shell }} -c ./scripts/ci/desktop-release.sh
        env:
          APPIMAGE_EXTRACT_AND_RUN: ${{ matrix.platform == 'ubuntu-latest-8-cores' && '1' || '' }}
          NO_STRIP: ${{ matrix.platform == 'ubuntu-latest-8-cores' && 'true' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}

      - name: Show sccache stats
        if: always()
        run: nix develop --no-update-lock-file .#${{ matrix.nix_shell }} -c sccache --show-stats

      - name: Collect desktop release checksums
        run: |
          nix develop --no-update-lock-file .#${{ matrix.nix_shell }} -c ./scripts/ci/attestation-manifest.sh \
            desktop-release-artifacts.sha256 \
            apps/maple-research/frontend/src-tauri/target/reproducibility/desktop-release-${{ matrix.artifact_prefix }}-final.sha256 \
            apps/maple-research/frontend/src-tauri/target/reproducibility/desktop-release-${{ matrix.artifact_prefix }}-*.sha256
          cat desktop-release-artifacts.sha256

      - name: Attest desktop release artifacts
        # Keep release uploads running if GitHub token policy rejects artifact attestation.
        continue-on-error: true
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # was v4
        with:
          subject-checksums: desktop-release-artifacts.sha256

      - name: Upload desktop release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.classify-app-release.outputs.tag }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("${file}")
          done < <(find apps/maple-research/frontend/src-tauri/target -type f \( \
            -name '*.dmg' -o \
            -name '*.app.tar.gz' -o \
            -name '*.app.tar.gz.sig' -o \
            -name 'Maple_*.AppImage' -o \
            -name 'Maple_*.AppImage.sig' -o \
            -name '*.deb' -o \
            -name '*.deb.sig' -o \
            -name '*.rpm' -o \
            -name '*.rpm.sig' -o \
            -path '*/reproducibility/desktop-release-*.sha256' \
          \) -print0 | LC_ALL=C sort -z)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No desktop release artifacts found." >&2
            exit 1
          fi

          gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber

  build-windows:
    needs: classify-app-release
    runs-on: windows-2025
    environment: windows-signing
    env:
      MAPLE_WINDOWS_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      MAPLE_WINDOWS_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
      MAPLE_WINDOWS_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          ref: ${{ needs.classify-app-release.outputs.release_sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # was v1
        with:
          bun-version: 1.3.5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # was stable
        with:
          toolchain: 1.94.1

      - name: Install sccache
        shell: bash
        run: |
          SCCACHE_VERSION=0.16.0
          SCCACHE_SHA256="c82319cc392b693e9fc72e6567cce47e218308f00fbf1df942e39b62e30f98da"
          SCCACHE_ARCHIVE="sccache-v${SCCACHE_VERSION}-x86_64-pc-windows-msvc.tar.gz"
          SCCACHE_URL="https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/${SCCACHE_ARCHIVE}"
          (
            cd "$RUNNER_TEMP"
            curl --fail --location --show-error --silent "$SCCACHE_URL" --output "$SCCACHE_ARCHIVE"
            echo "${SCCACHE_SHA256}  ${SCCACHE_ARCHIVE}" | sha256sum --check -
            tar xzf "$SCCACHE_ARCHIVE"
          )
          SCCACHE_BIN_DIR="$RUNNER_TEMP/sccache-v${SCCACHE_VERSION}-x86_64-pc-windows-msvc"
          echo "$SCCACHE_BIN_DIR" >> "$GITHUB_PATH"
          "$SCCACHE_BIN_DIR/sccache.exe" --version

      - name: Cache sccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # was v4
        with:
          path: ~\AppData\Local\Mozilla\sccache
          key: ${{ runner.os }}-sccache-windows-v0.16.0-rust-1.94.1-${{ hashFiles('apps/maple-research/frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-windows-v0.16.0-rust-1.94.1-

      - name: Build Windows app executable
        shell: bash
        run: ./scripts/ci/desktop-windows-release.sh build

      - name: Bundle Windows unsigned installer baseline
        shell: bash
        run: ./scripts/ci/desktop-windows-release.sh unsigned-bundle

      - name: Azure login for Artifact Signing
        uses: azure/login@2dd0bbf4064d5a1812889dc200bb8eed2597f82a # was v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Artifact Signing module
        shell: pwsh
        run: ./scripts/ci/install-windows-artifact-signing.ps1

      - name: Bundle Windows installer
        shell: bash
        run: ./scripts/ci/desktop-windows-release.sh bundle

      - name: Resolve Windows installer paths
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/_common.sh
          setup_exe="$(windows_release_setup_exe_required)"
          echo "MAPLE_WINDOWS_SETUP_EXE_REL=$(repo_relative_path "${setup_exe}")" >> "${GITHUB_ENV}"

      - name: Install minisign
        shell: pwsh
        run: ./scripts/ci/install-windows-minisign.ps1

      - name: Finalize Windows updater signatures and checksums
        shell: bash
        run: ./scripts/ci/desktop-windows-release.sh finalize
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Collect Windows release checksums
        shell: bash
        run: |
          ./scripts/ci/attestation-manifest.sh \
            windows-release-artifacts.sha256 \
            apps/maple-research/frontend/src-tauri/target/reproducibility/desktop-release-windows-final.sha256 \
            apps/maple-research/frontend/src-tauri/target/reproducibility/desktop-release-windows-signed-canonical.sha256 \
            apps/maple-research/frontend/src-tauri/target/reproducibility/desktop-release-windows-runtime-dlls.sha256
          cat windows-release-artifacts.sha256

      - name: Attest Windows release artifacts
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # was v4
        with:
          subject-checksums: windows-release-artifacts.sha256

      - name: Upload Windows release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.classify-app-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          files=("${MAPLE_WINDOWS_SETUP_EXE_REL}" "${MAPLE_WINDOWS_SETUP_EXE_REL}.sig")
          while IFS= read -r -d '' file; do
            files+=("${file}")
          done < <(find apps/maple-research/frontend/src-tauri -type f \( \
            -path '*/target/reproducibility/desktop-release-windows-*.sha256' \
          \) -print0 | LC_ALL=C sort -z)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Windows release artifacts found." >&2
            exit 1
          fi

          gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber

  build-android:
    environment: android-signing
    needs: classify-app-release
    runs-on: ubuntu-latest-8-cores
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          ref: ${{ needs.classify-app-release.outputs.release_sha }}
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # was v22
        with:
          github-token: ""

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # was v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/maple-research/frontend/bun.lock', 'sdk/bun.lock') }}

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # was v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/maple-research/frontend/src-tauri/gen/android/**/*.gradle*', 'apps/maple-research/frontend/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache sccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # was v4
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-android-release-${{ hashFiles('apps/maple-research/frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-android-release-
            ${{ runner.os }}-sccache-

      - name: Build Tauri Android App
        run: nix develop --no-update-lock-file .#android -c ./scripts/ci/android-release.sh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Show sccache stats
        if: always()
        run: nix develop --no-update-lock-file .#android -c sccache --show-stats

      - name: Collect Android release checksums
        run: |
          nix develop --no-update-lock-file .#android -c ./scripts/ci/attestation-manifest.sh \
            android-release-artifacts.sha256 \
            apps/maple-research/frontend/src-tauri/target/reproducibility/android-release-final.sha256 \
            apps/maple-research/frontend/src-tauri/target/reproducibility/android-release-*.sha256
          cat android-release-artifacts.sha256

      - name: Attest Android release artifacts
        # Keep release uploads running if GitHub token policy rejects artifact attestation.
        continue-on-error: true
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # was v4
        with:
          subject-checksums: android-release-artifacts.sha256

      - name: Upload Android release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.classify-app-release.outputs.tag }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("${file}")
          done < <(find apps/maple-research/frontend/src-tauri -type f \( \
            -name '*.apk' -o \
            -name '*.aab' -o \
            -path '*/reproducibility/android-release-*.sha256' \
          \) -print0 | LC_ALL=C sort -z)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Android release artifacts found." >&2
            exit 1
          fi

          gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber

  build-ios:
    environment: apple-signing
    needs: classify-app-release
    runs-on: macos-26-xlarge
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          ref: ${{ needs.classify-app-release.outputs.release_sha }}
          persist-credentials: false

      # Xcode 26.5 is temporarily exposed as a beta app on macos-26 runners: https://github.com/actions/runner-images/issues/14108
      - name: Select Xcode 26.5
        id: select_xcode
        run: |
          set -euo pipefail
          for xcode_app in \
            /Applications/Xcode_26.5.0.app \
            /Applications/Xcode_26.5_beta_2.app \
            /Applications/Xcode_26.5_beta.app
          do
            if [ -x "${xcode_app}/Contents/Developer/usr/bin/xcodebuild" ]; then
              sudo xcode-select -s "${xcode_app}/Contents/Developer"
              xcode_info="$(xcodebuild -version)"
              printf '%s\n' "${xcode_info}"
              printf 'version=%s\n' "$(printf '%s\n' "${xcode_info}" | awk '/^Xcode / { print $2; exit }')" >> "${GITHUB_OUTPUT}"
              printf 'build=%s\n' "$(printf '%s\n' "${xcode_info}" | awk '/^Build version / { print $3; exit }')" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          done
          echo "Xcode 26.5 is not installed on this runner." >&2
          ls -1 /Applications/Xcode*.app >&2 || true
          exit 1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # was v22
        with:
          github-token: ""

      - name: Cache Xcode DerivedData and SourcePackages
        uses: irgaly/xcode-cache@4141f139f00e335c6e1031fb93e667181f86146f # was v1
        with:
          key: xcode-cache-ios-xcode26.5-${{ steps.select_xcode.outputs.build }}-${{ github.workflow }}-${{ hashFiles('apps/maple-research/frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            xcode-cache-ios-xcode26.5-${{ steps.select_xcode.outputs.build }}-${{ github.workflow }}-
            xcode-cache-ios-xcode26.5-${{ steps.select_xcode.outputs.build }}-

      - name: Cache ONNX Runtime iOS artifact
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # was v4
        with:
          path: |
            apps/maple-research/frontend/src-tauri/onnxruntime-ios
          key: release-onnxruntime-ios-artifact-1.23.2-xcode26.5-${{ steps.select_xcode.outputs.build }}-${{ hashFiles('flake.lock', 'flake.nix', 'scripts/ci/_common.sh', 'scripts/ci/ios-onnxruntime.sh', 'apps/maple-research/frontend/src-tauri/scripts/build-ios-onnxruntime-all.sh', 'apps/maple-research/frontend/src-tauri/scripts/canonicalize-static-archive.py', 'apps/maple-research/frontend/src-tauri/scripts/onnxruntime-pins.sh') }}
          restore-keys: |
            release-onnxruntime-ios-artifact-1.23.2-xcode26.5-${{ steps.select_xcode.outputs.build }}-

      - name: Prepare ONNX Runtime iOS artifact
        run: nix develop --no-update-lock-file .#apple -c ./scripts/ci/ios-onnxruntime.sh
        timeout-minutes: 90

      - name: Build Tauri iOS App
        run: nix develop --no-update-lock-file .#apple -c ./scripts/ci/ios-release.sh
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          MAPLE_ENFORCE_IOS_SIGNED_REPRODUCIBILITY: "1"
        timeout-minutes: 90

      - name: Collect iOS release checksums
        run: |
          nix develop --no-update-lock-file .#apple -c ./scripts/ci/attestation-manifest.sh \
            ios-release-artifacts.sha256 \
            apps/maple-research/frontend/src-tauri/target/reproducibility/ios-release-final.sha256 \
            apps/maple-research/frontend/src-tauri/target/reproducibility/ios-release-*.sha256 \
            apps/maple-research/frontend/src-tauri/target/reproducibility/ios-release-*.txt \
            apps/maple-research/frontend/src-tauri/target/reproducibility/ios-onnxruntime-*.sha256
          cat ios-release-artifacts.sha256

      - name: Attest iOS release artifacts
        # Keep release uploads running if GitHub token policy rejects artifact attestation.
        continue-on-error: true
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # was v4
        with:
          subject-checksums: ios-release-artifacts.sha256

      - name: Upload iOS release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.classify-app-release.outputs.tag }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("${file}")
          done < <(find apps/maple-research/frontend/src-tauri -type f \( \
            -name '*.ipa' -o \
            -path '*/reproducibility/ios-release-*.sha256' -o \
            -path '*/reproducibility/ios-release-*.txt' -o \
            -path '*/reproducibility/ios-onnxruntime-*.sha256' \
          \) -print0 | LC_ALL=C sort -z)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No iOS release artifacts found." >&2
            exit 1
          fi

          gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber

  build-web:
    needs: classify-app-release
    runs-on: ubuntu-latest-8-cores
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          ref: ${{ needs.classify-app-release.outputs.release_sha }}
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # was v22
        with:
          github-token: ""

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # was v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/maple-research/frontend/bun.lock', 'sdk/bun.lock') }}

      - name: Build web artifact
        run: nix develop --no-update-lock-file .#ci -c ./scripts/ci/web.sh
        env:
          MAPLE_WEB_ENVIRONMENT: release

      - name: Collect web release checksums
        run: cat apps/maple-research/frontend/src-tauri/target/reproducibility/web-final.sha256

      - name: Attest web release artifact
        # Keep release uploads running if GitHub token policy rejects artifact attestation.
        continue-on-error: true
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # was v4
        with:
          subject-checksums: apps/maple-research/frontend/src-tauri/target/reproducibility/web-final.sha256

      - name: Upload web release artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.classify-app-release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" \
            apps/maple-research/frontend/src-tauri/target/reproducibility/maple-web-dist.tar.gz \
            apps/maple-research/frontend/src-tauri/target/reproducibility/web-final.sha256 \
            --clobber

  build-proxy:
    name: Build proxy (${{ matrix.archive }})
    needs: classify-app-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            archive: maple-proxy-linux-x86_64.tar.gz
          - runner: ubuntu-24.04-arm
            archive: maple-proxy-linux-aarch64.tar.gz
          - runner: macos-26-xlarge
            archive: maple-proxy-macos-aarch64.tar.gz
          - runner: windows-2025
            archive: maple-proxy-windows-x86_64.zip
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          ref: ${{ needs.classify-app-release.outputs.release_sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # was stable
        with:
          toolchain: 1.89.0

      - name: Cache proxy Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # was v2
        with:
          workspaces: proxy -> target
          add-rust-environment-hash-key: "false"
          key: release-${{ matrix.archive }}-${{ hashFiles('proxy/Cargo.lock') }}

      - name: Build and package native proxy binary
        shell: bash
        run: ./scripts/ci/proxy-release.sh proxy-release-assets "${{ matrix.archive }}"

      - name: Upload native proxy binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # was v4
        with:
          name: proxy-release-${{ matrix.archive }}
          path: proxy-release-assets/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  publish-proxy-release-artifacts:
    needs:
      - classify-app-release
      - build-proxy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          ref: ${{ needs.classify-app-release.outputs.release_sha }}
          persist-credentials: false

      - name: Download native proxy binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # was v4
        with:
          pattern: proxy-release-*
          path: proxy-release-assets
          merge-multiple: true

      - name: Finalize and verify proxy release assets
        run: |
          set -euo pipefail
          assets=(
            maple-proxy-linux-aarch64.tar.gz
            maple-proxy-linux-x86_64.tar.gz
            maple-proxy-macos-aarch64.tar.gz
            maple-proxy-windows-x86_64.zip
          )
          (
            cd proxy-release-assets
            sha256sum "${assets[@]}" > maple-proxy-release-final.sha256
          )
          ./scripts/ci/verify-release-artifacts.sh proxy-release-assets proxy

          attested_assets=(
            proxy-release-assets/maple-proxy-linux-aarch64.tar.gz
            proxy-release-assets/maple-proxy-linux-x86_64.tar.gz
            proxy-release-assets/maple-proxy-macos-aarch64.tar.gz
            proxy-release-assets/maple-proxy-windows-x86_64.zip
            proxy-release-assets/maple-proxy-release-final.sha256
          )
          sha256sum "${attested_assets[@]}" > proxy-release-attestation.sha256
          cat proxy-release-assets/maple-proxy-release-final.sha256

      - name: Attest proxy release assets
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # was v4
        with:
          subject-checksums: proxy-release-attestation.sha256

      - name: Upload proxy assets to the Maple release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.classify-app-release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" \
            proxy-release-assets/maple-proxy-linux-aarch64.tar.gz \
            proxy-release-assets/maple-proxy-linux-x86_64.tar.gz \
            proxy-release-assets/maple-proxy-macos-aarch64.tar.gz \
            proxy-release-assets/maple-proxy-windows-x86_64.zip \
            proxy-release-assets/maple-proxy-release-final.sha256 \
            --clobber

  verify-proxy-release-artifacts:
    needs:
      - classify-app-release
      - publish-proxy-release-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          ref: ${{ needs.classify-app-release.outputs.release_sha }}
          persist-credentials: false

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.classify-app-release.outputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "${RELEASE_TAG}" -D artifacts

      - name: Verify published proxy release assets
        run: ./scripts/ci/verify-release-artifacts.sh artifacts proxy

  verify-android-release-artifacts:
    needs:
      - classify-app-release
      - build-android
    runs-on: ubuntu-latest-8-cores
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          ref: ${{ needs.classify-app-release.outputs.release_sha }}
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # was v22
        with:
          github-token: ""

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.classify-app-release.outputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "${RELEASE_TAG}" -D artifacts

      - name: Verify Android release artifact reproducibility proofs
        env:
          MAPLE_REQUIRE_ANDROID_SIGNATURE_VERIFICATION: "1"
        run: nix develop --no-update-lock-file .#android -c ./scripts/ci/verify-release-artifacts.sh artifacts android

  verify-linux-desktop-release-artifacts:
    needs:
      - classify-app-release
      - build-tauri
    runs-on: ubuntu-latest-8-cores
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          ref: ${{ needs.classify-app-release.outputs.release_sha }}
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # was v22
        with:
          github-token: ""

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.classify-app-release.outputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "${RELEASE_TAG}" -D artifacts

      - name: Verify Linux desktop release artifact reproducibility proofs
        run: nix develop --no-update-lock-file .#desktop-linux -c ./scripts/ci/verify-release-artifacts.sh artifacts linux

  verify-macos-desktop-release-artifacts:
    needs:
      - classify-app-release
      - build-tauri
    runs-on: macos-26-xlarge
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          ref: ${{ needs.classify-app-release.outputs.release_sha }}
          persist-credentials: false

      # Xcode 26.5 is temporarily exposed as a beta app on macos-26 runners: https://github.com/actions/runner-images/issues/14108
      - name: Select Xcode 26.5
        run: |
          set -euo pipefail
          for xcode_app in \
            /Applications/Xcode_26.5.0.app \
            /Applications/Xcode_26.5_beta_2.app \
            /Applications/Xcode_26.5_beta.app
          do
            if [ -x "${xcode_app}/Contents/Developer/usr/bin/xcodebuild" ]; then
              sudo xcode-select -s "${xcode_app}/Contents/Developer"
              xcodebuild -version
              exit 0
            fi
          done
          echo "Xcode 26.5 is not installed on this runner." >&2
          ls -1 /Applications/Xcode*.app >&2 || true
          exit 1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # was v22
        with:
          github-token: ""

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.classify-app-release.outputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "${RELEASE_TAG}" -D artifacts

      - name: Verify macOS desktop release artifact reproducibility proofs
        run: nix develop --no-update-lock-file .#ci -c ./scripts/ci/verify-release-artifacts.sh artifacts macos

  verify-windows-desktop-release-artifacts:
    needs:
      - classify-app-release
      - build-windows
    runs-on: ubuntu-latest-8-cores
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          ref: ${{ needs.classify-app-release.outputs.release_sha }}
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # was v22
        with:
          github-token: ""

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.classify-app-release.outputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "${RELEASE_TAG}" -D artifacts

      - name: Verify Windows desktop release artifact reproducibility proofs
        run: nix develop --no-update-lock-file .#ci -c ./scripts/ci/verify-release-artifacts.sh artifacts windows

  verify-desktop-release-artifacts:
    needs:
      - classify-app-release
      - verify-linux-desktop-release-artifacts
      - verify-macos-desktop-release-artifacts
      - verify-windows-desktop-release-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Verify desktop release artifact checks completed
        run: echo "Desktop release artifact verification completed for Linux, macOS, and Windows."

  update-latest-json:
    needs:
      - classify-app-release
      - verify-desktop-release-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          ref: ${{ needs.classify-app-release.outputs.release_sha }}
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # was v22
        with:
          github-token: ""

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.classify-app-release.outputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "${RELEASE_TAG}" -D artifacts

      - name: Generate latest.json
        env:
          RELEASE_TAG: ${{ needs.classify-app-release.outputs.tag }}
          MAPLE_LATEST_JSON_PUB_DATE: ${{ github.event.release.published_at || github.event.release.created_at }}
        run: nix develop --no-update-lock-file .#ci -c ./scripts/ci/latest-json.sh artifacts latest.json

      - name: Collect latest.json checksums
        run: |
          nix develop --no-update-lock-file .#ci -c ./scripts/ci/attestation-manifest.sh \
            latest-json-artifacts.sha256 \
            apps/maple-research/frontend/src-tauri/target/reproducibility/latest-json-final.sha256
          cat latest-json-artifacts.sha256

      - name: Attest latest.json
        # Keep release uploads running if GitHub token policy rejects artifact attestation.
        continue-on-error: true
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # was v4
        with:
          subject-checksums: latest-json-artifacts.sha256

      - name: Upload latest.json and provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.classify-app-release.outputs.tag }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            latest.json \
            apps/maple-research/frontend/src-tauri/target/reproducibility/latest-json-final.sha256 \
            --clobber

  verify-release-artifacts:
    needs:
      - classify-app-release
      - verify-desktop-release-artifacts
      - build-ios
      - build-web
      - update-latest-json
      - verify-android-release-artifacts
      - verify-proxy-release-artifacts
    runs-on: macos-26-xlarge
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          ref: ${{ needs.classify-app-release.outputs.release_sha }}
          persist-credentials: false

      # Xcode 26.5 is temporarily exposed as a beta app on macos-26 runners: https://github.com/actions/runner-images/issues/14108
      - name: Select Xcode 26.5
        run: |
          set -euo pipefail
          for xcode_app in \
            /Applications/Xcode_26.5.0.app \
            /Applications/Xcode_26.5_beta_2.app \
            /Applications/Xcode_26.5_beta.app
          do
            if [ -x "${xcode_app}/Contents/Developer/usr/bin/xcodebuild" ]; then
              sudo xcode-select -s "${xcode_app}/Contents/Developer"
              xcodebuild -version
              exit 0
            fi
          done
          echo "Xcode 26.5 is not installed on this runner." >&2
          ls -1 /Applications/Xcode*.app >&2 || true
          exit 1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # was v22
        with:
          github-token: ""

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.classify-app-release.outputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "${RELEASE_TAG}" -D artifacts

      - name: Verify release artifact reproducibility proofs
        run: nix develop --no-update-lock-file .#ci -c ./scripts/ci/verify-release-artifacts.sh artifacts macos windows ios web latest-json proxy
        env:
          MAPLE_ENFORCE_IOS_SIGNED_REPRODUCIBILITY: "1"

  publish-release-verification-guide:
    needs:
      - classify-app-release
      - verify-release-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          ref: ${{ needs.classify-app-release.outputs.release_sha }}
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # was v22
        with:
          github-token: ""

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.classify-app-release.outputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "${RELEASE_TAG}" -D artifacts
          rm -f \
            artifacts/MAPLE_RELEASE_VERIFICATION.md \
            artifacts/MAPLE_RELEASE_VERIFICATION.md.sha256

      - name: Generate release verification guide
        env:
          RELEASE_TAG: ${{ needs.classify-app-release.outputs.tag }}
        run: |
          nix develop --no-update-lock-file .#ci -c ./scripts/ci/release-verification-guide.sh \
            artifacts \
            MAPLE_RELEASE_VERIFICATION.md
          sha256sum MAPLE_RELEASE_VERIFICATION.md > MAPLE_RELEASE_VERIFICATION.md.sha256
          sha256sum \
            MAPLE_RELEASE_VERIFICATION.md \
            MAPLE_RELEASE_VERIFICATION.md.sha256 \
            > release-verification-guide-artifacts.sha256
          cat release-verification-guide-artifacts.sha256

      - name: Attest release verification guide
        # Keep the guide upload running if GitHub token policy rejects artifact attestation.
        continue-on-error: true
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # was v4
        with:
          subject-checksums: release-verification-guide-artifacts.sha256

      - name: Upload release verification guide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.classify-app-release.outputs.tag }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            MAPLE_RELEASE_VERIFICATION.md \
            MAPLE_RELEASE_VERIFICATION.md.sha256 \
            --clobber
