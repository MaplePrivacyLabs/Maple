name: Repository CI checks

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - "scripts/ci/**"
      - "scripts/fetch-tokenizer-assets.py"
      - "crates/model-tokenizer/**"
      - "flake.nix"
      - "flake.lock"
  pull_request:
    # Run unprivileged validation for stacked PRs as well as master targets.
    paths:
      - ".github/workflows/**"
      - "scripts/ci/**"
      - "scripts/fetch-tokenizer-assets.py"
      - "crates/model-tokenizer/**"
      - "flake.nix"
      - "flake.lock"

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""

      - name: Verify pinned Nix runtime
        run: bash scripts/ci/verify-nix-runtime.sh

      - name: Validate repository CI configuration
        run: nix flake check --no-update-lock-file --print-build-logs
