name: Rust Unit Tests

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/rust-tests.yml"
      - "apps/maple-research/frontend/src-tauri/**"
      - "proxy/Cargo.toml"
      - "sdk/rust/Cargo.toml"
      - "sdk/rust/build.rs"
      - "sdk/rust/src/**"
      - "sdk/rust/assets/**"
      - "proxy/src/**"
      - "scripts/ci/_common.sh"
      - "scripts/ci/rust.sh"
      - "scripts/ci/verify-local-rust-deps.sh"
      - "scripts/ci/verify-agent-rust-deps.py"
      - "scripts/ci/test_agent_rust_deps.py"
      - "flake.nix"
      - "flake.lock"
  pull_request:
    # Run unprivileged validation for stacked PRs as well as master targets.
    paths:
      - ".github/workflows/rust-tests.yml"
      - "apps/maple-research/frontend/src-tauri/**"
      - "proxy/Cargo.toml"
      - "sdk/rust/Cargo.toml"
      - "sdk/rust/build.rs"
      - "sdk/rust/src/**"
      - "sdk/rust/assets/**"
      - "proxy/src/**"
      - "scripts/ci/_common.sh"
      - "scripts/ci/rust.sh"
      - "scripts/ci/verify-local-rust-deps.sh"
      - "scripts/ci/verify-agent-rust-deps.py"
      - "scripts/ci/test_agent_rust_deps.py"
      - "flake.nix"
      - "flake.lock"

concurrency:
  # Replace superseded PR validation; keep master/manual runs independent.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""

      - name: Verify pinned Nix runtime
        run: bash scripts/ci/verify-nix-runtime.sh

      - name: Cache sccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # was v4
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-rust-tests-${{ hashFiles('apps/maple-research/frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-rust-tests-
            ${{ runner.os }}-sccache-

      - name: Run Rust unit tests
        run: |
          nix develop --no-update-lock-file .#ci -c ./scripts/ci/verify-local-rust-deps.sh
          nix develop --no-update-lock-file .#ci -c ./scripts/ci/rust.sh

      - name: Show sccache stats
        if: always()
        run: nix develop --no-update-lock-file .#ci -c ./scripts/ci/sccache-stats.sh
