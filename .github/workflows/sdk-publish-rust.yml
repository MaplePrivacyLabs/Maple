name: Publish Rust SDK

run-name: Rust SDK ${{ inputs.version }} (${{ inputs.dry_run && 'dry run' || inputs.mode }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable X.Y.Z already committed in sdk/rust/Cargo.toml on master
        type: string
        required: true
      mode:
        description: Trusted publishing, or the one-time first-package bootstrap
        type: choice
        options: [trusted, bootstrap]
        default: trusted
        required: true
      dry_run:
        description: Build and validate only; uncheck to publish after environment approval
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: sdk-crates-publish
  cancel-in-progress: false

env:
  SDK_VERSION: ${{ inputs.version }}
  SDK_MODE: ${{ inputs.mode }}
  SDK_PUBLISH_WORKFLOW_SHA: ${{ github.workflow_sha }}

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'MaplePrivacyLabs/Maple' &&
      github.repository_id == '923138240' &&
      github.repository_owner_id == '322649754' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify source, version, and registry state
        run: python3 -I scripts/ci/sdk_publish.py source --kind rust --version "$SDK_VERSION" --mode "$SDK_MODE"

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
        with:
          source-tag: v3.24.2
          github-token: ""

      - name: Verify pinned Nix runtime
        run: bash scripts/ci/verify-nix-runtime.sh

      - name: Build and test the exact crate without publishing credentials
        run: bash scripts/ci/build-sdk-publish.sh rust "$RUNNER_TEMP/sdk-package"

      - name: Bind the tested crate to this source and run
        run: >-
          python3 -I scripts/ci/sdk_publish.py bundle --kind rust --version "$SDK_VERSION" --mode "$SDK_MODE"
          --archive "$RUNNER_TEMP/sdk-package/package.crate" --output "$RUNNER_TEMP/sdk-bundle"

      - name: Validate crates.io upload metadata without credentials
        run: >-
          python3 -I scripts/ci/sdk_crates_upload.py --directory "$RUNNER_TEMP/sdk-bundle"
          --version "$SDK_VERSION" --validate-only

      - name: Upload the tested crate and manifest
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-crates-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-bundle/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: >-
      !inputs.dry_run &&
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'MaplePrivacyLabs/Maple' &&
      github.repository_id == '923138240' &&
      github.repository_owner_id == '322649754' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: sdk-crates
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download only the artifact created by this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/sdk-bundle

      - name: Verify the reviewed artifact and repeat registry checks
        run: >-
          python3 -I scripts/ci/sdk_publish.py verify --kind rust --version "$SDK_VERSION" --mode "$SDK_MODE"
          --directory "$RUNNER_TEMP/sdk-bundle"

      - name: Obtain a short-lived crates.io credential
        id: auth
        if: ${{ inputs.mode == 'trusted' }}
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Upload the verified crate once
        id: publish
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.mode == 'bootstrap' && secrets.CRATES_BOOTSTRAP_TOKEN || steps.auth.outputs.token }}
        run: >-
          python3 -I scripts/ci/sdk_crates_upload.py --directory "$RUNNER_TEMP/sdk-bundle"
          --version "$SDK_VERSION"

      # Confirm even after an ambiguous upload error; never blindly retry PUT.
      - name: Confirm the immutable registry result
        if: ${{ always() && steps.publish.outcome != 'skipped' }}
        run: >-
          python3 -I scripts/ci/sdk_publish.py confirm --kind rust --version "$SDK_VERSION" --mode "$SDK_MODE"
          --directory "$RUNNER_TEMP/sdk-bundle"
