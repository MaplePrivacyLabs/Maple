name: SDK Rust CI

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/sdk-rust.yml"
      - "sdk/rust/**"
      - "sdk/rust-toolchain.toml"
      - "sdk/flake.nix"
      - "sdk/flake.lock"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/sdk-rust.yml"
      - "sdk/rust/**"
      - "sdk/rust-toolchain.toml"
      - "sdk/flake.nix"
      - "sdk/flake.lock"

concurrency:
  # Replace superseded PR validation; keep master/manual runs independent.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  sdk-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""

      - name: Verify pinned Nix runtime
        run: bash scripts/ci/verify-nix-runtime.sh

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # was v2
        with:
          workspaces: sdk/rust -> target
          add-rust-environment-hash-key: "false"
          key: ${{ hashFiles('sdk/rust/Cargo.lock', 'sdk/rust-toolchain.toml', 'sdk/flake.lock') }}

      - name: Run credential-free Rust SDK checks
        run: |
          nix develop --no-update-lock-file ./sdk -c bash -lc '
            set -euo pipefail
            cd sdk/rust
            cargo fmt --all -- --check
            cargo clippy --locked --all-targets --all-features -- -D warnings
            cargo test --locked --all-features --lib
            RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features
          '
