name: SDK TypeScript CI

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/sdk-typescript.yml"
      - "sdk/src/**"
      - "sdk/.npmrc"
      - "sdk/.prettierrc.json"
      - "sdk/bun.lock"
      - "sdk/bunfig.toml"
      - "sdk/eslint.config.js"
      - "sdk/package.json"
      - "sdk/tsconfig.build.json"
      - "sdk/tsconfig.json"
      - "sdk/vite.config.ts"
      - "sdk/flake.nix"
      - "sdk/flake.lock"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/sdk-typescript.yml"
      - "sdk/src/**"
      - "sdk/.npmrc"
      - "sdk/.prettierrc.json"
      - "sdk/bun.lock"
      - "sdk/bunfig.toml"
      - "sdk/eslint.config.js"
      - "sdk/package.json"
      - "sdk/tsconfig.build.json"
      - "sdk/tsconfig.json"
      - "sdk/vite.config.ts"
      - "sdk/flake.nix"
      - "sdk/flake.lock"

concurrency:
  # Replace superseded PR validation; keep master/manual runs independent.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdk-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""

      - name: Verify pinned Nix runtime
        run: bash scripts/ci/verify-nix-runtime.sh

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # was v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-sdk-bun-${{ hashFiles('sdk/bun.lock') }}

      - name: Run credential-free TypeScript SDK checks
        run: |
          nix develop --no-update-lock-file ./sdk -c bash -lc '
            set -euo pipefail
            cd sdk
            bun install --frozen-lockfile --ignore-scripts
            bun audit --audit-level=high
            bun run format:check
            bun run build
            VITE_OPEN_SECRET_API_URL=http://127.0.0.1:3000 \
              VITE_OPEN_SECRET_PCR_ENVIRONMENT=development \
              bun test \
                src/lib/test/*.test.ts \
                src/lib/test/integration/attestation.test.ts \
                src/lib/test/integration/developerHook.test.ts \
                src/lib/test/integration/liveAttestation.test.ts \
                src/lib/test/integration/pcr.test.ts \
                src/lib/test/integration/platformPushSettings.test.ts \
                src/lib/test/integration/web.test.ts \
                --timeout 30000
          '
