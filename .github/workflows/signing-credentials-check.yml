name: Check app signing credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-signing:
    environment: desktop-signing
    runs-on: ubuntu-latest
    steps:
      - name: Verify configured credential availability
        shell: python
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          import os
          required = ['APPLE_CERTIFICATE', 'APPLE_CERTIFICATE_PASSWORD', 'APPLE_ID', 'APPLE_ID_PASSWORD', 'APPLE_TEAM_ID', 'APPLE_PROVISIONING_PROFILE', 'TAURI_SIGNING_PRIVATE_KEY']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing signing configuration: " + ", ".join(missing))
          print("Signing configuration is available; no signing or publication performed.")

  apple-signing:
    environment: apple-signing
    runs-on: ubuntu-latest
    steps:
      - name: Verify configured credential availability
        shell: python
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          import os
          required = ['APPLE_API_ISSUER', 'APPLE_API_KEY', 'APPLE_API_PRIVATE_KEY', 'APPLE_TEAM_ID']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing signing configuration: " + ", ".join(missing))
          print("Signing configuration is available; no signing or publication performed.")

  android-signing:
    environment: android-signing
    runs-on: ubuntu-latest
    steps:
      - name: Verify configured credential availability
        shell: python
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          import os
          required = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing signing configuration: " + ", ".join(missing))
          print("Signing configuration is available; no signing or publication performed.")

  windows-signing:
    environment: windows-signing
    runs-on: ubuntu-latest
    steps:
      - name: Verify configured credential availability
        shell: python
        env:
          AZURE_ACCOUNT: ${{ secrets.AZURE_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT: ${{ secrets.AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_PROFILE: ${{ secrets.AZURE_PROFILE }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          import os
          required = ['AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME', 'AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME', 'AZURE_ARTIFACT_SIGNING_ENDPOINT', 'AZURE_CLIENT_ID', 'AZURE_SUBSCRIPTION_ID', 'AZURE_TENANT_ID', 'TAURI_SIGNING_PRIVATE_KEY']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing signing configuration: " + ", ".join(missing))
          print("Signing configuration is available; no signing or publication performed.")

  zapstore-publishing:
    environment: zapstore-publishing
    runs-on: ubuntu-latest
    steps:
      - name: Verify configured credential availability
        shell: python
        env:
          ZAPSTORE_SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
        run: |
          import os
          required = ['ZAPSTORE_SIGN_WITH']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing signing configuration: " + ", ".join(missing))
          print("Signing configuration is available; no signing or publication performed.")
