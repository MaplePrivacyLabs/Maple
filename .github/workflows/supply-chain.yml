name: Rust supply-chain checks

on:
  pull_request:
    paths:
      - ".github/workflows/supply-chain.yml"
      - "apps/maple-research/deny.toml"
      - "apps/maple-research/frontend/src-tauri/Cargo.toml"
      - "apps/maple-research/frontend/src-tauri/Cargo.lock"
      - "proxy/Cargo.toml"
      - "sdk/rust/Cargo.toml"
  push:
    branches: [master]
    paths:
      - ".github/workflows/supply-chain.yml"
      - "apps/maple-research/deny.toml"
      - "apps/maple-research/frontend/src-tauri/Cargo.toml"
      - "apps/maple-research/frontend/src-tauri/Cargo.lock"
      - "proxy/Cargo.toml"
      - "sdk/rust/Cargo.toml"
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: RustSec advisories and malicious crates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Check RustSec advisories and incident denylist
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: apps/maple-research/frontend/src-tauri/Cargo.toml
          command: check advisories bans
          arguments: --config apps/maple-research/deny.toml --all-features --locked
