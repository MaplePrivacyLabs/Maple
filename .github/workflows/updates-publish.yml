name: Publish updater metadata

run-name: Publish the current Maple release to Cloudflare

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: updates-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish current release
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'release' &&
        startsWith(github.event.workflow_run.head_branch, 'v') &&
        github.event.workflow_run.path == '.github/workflows/release.yml' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: updates-production
      url: https://updates.trymaple.ai/latest.json
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: master
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          github-token: ""

      - name: Prepare the current release bundle
        id: release
        env:
          EXPECTED_RELEASE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
          EXPECTED_RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          EXPECTED_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release-metadata
          gh api "repos/${REPOSITORY}/releases/latest" > release-metadata/release.json
          release_tag="$(jq -er 'select(.draft == false and .prerelease == false) | .tag_name' release-metadata/release.json)"
          [[ "${release_tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Latest GitHub Release is not a stable Research version." >&2
            exit 1
          }
          if [ -n "${EXPECTED_RELEASE_TAG}" ] && [ "${release_tag}" != "${EXPECTED_RELEASE_TAG}" ]; then
            echo "Completed release is no longer latest; skipping publication."
            echo "publish=false" >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          release_sha="$(gh api "repos/${REPOSITORY}/commits/${release_tag}" --jq .sha)"
          if [ -n "${EXPECTED_RELEASE_SHA}" ] && [ "${release_sha}" != "${EXPECTED_RELEASE_SHA}" ]; then
            echo "Release tag no longer identifies the completed workflow commit." >&2
            exit 1
          fi
          if [ -n "${EXPECTED_RUN_ID}" ]; then
            gh api "repos/${REPOSITORY}/actions/runs/${EXPECTED_RUN_ID}" | jq '{workflow_runs: [.]}' > release-metadata/runs.json
          else
            gh api --paginate --method GET "repos/${REPOSITORY}/actions/workflows/release.yml/runs" \
              -f event=release -f head_sha="${release_sha}" -f per_page=100 \
              --jq '.workflow_runs[]' | jq -s '{workflow_runs: .}' > release-metadata/runs.json
          fi

          asset_id="$(jq -er '[.assets[] | select(.name == "latest.json")] | select(length == 1) | .[0] | select(.state == "uploaded" and (.size | type == "number") and .size > 0 and .size <= 65536) | .id' release-metadata/release.json)"
          gh api -H "Accept: application/octet-stream" \
            "repos/${REPOSITORY}/releases/assets/${asset_id}" > release-metadata/latest.json

          nix develop --no-update-lock-file .#ci -c ./scripts/ci/updates.sh
          # The child shell expands its positional argument.
          # shellcheck disable=SC2016
          nix develop --no-update-lock-file .#ci -c bash -c '
            cd services/updates
            bun run prepare:installers prepare ../../release-metadata/release.json \
              ../../release-metadata/latest.json ../../release-metadata/runs.json "$1" public/installers.json
          ' -- "${release_sha}"
          cp release-metadata/latest.json services/updates/public/latest.json
          echo "publish=true" >>"${GITHUB_OUTPUT}"
          {
            echo "RELEASE_ID=$(jq -er .id release-metadata/release.json)"
            echo "RELEASE_TAG=${release_tag}"
            echo "RELEASE_SHA=${release_sha}"
            echo "RELEASE_RUN_ID=${EXPECTED_RUN_ID}"
          } >>"${GITHUB_ENV}"

      - name: Recheck release and asset identities before deployment
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/releases/latest" > release-metadata/current.json
          [ "$(gh api "repos/${REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)" = "${RELEASE_SHA}" ] || {
            echo "Release tag changed during publication." >&2
            exit 1
          }
          if [ -n "${RELEASE_RUN_ID}" ]; then
            gh api "repos/${REPOSITORY}/actions/runs/${RELEASE_RUN_ID}" | jq '{workflow_runs: [.]}' > release-metadata/current-runs.json
          else
            gh api --paginate --method GET "repos/${REPOSITORY}/actions/workflows/release.yml/runs" \
              -f event=release -f head_sha="${RELEASE_SHA}" -f per_page=100 \
              --jq '.workflow_runs[]' | jq -s '{workflow_runs: .}' > release-metadata/current-runs.json
          fi
          # The child shell expands its positional argument.
          # shellcheck disable=SC2016
          nix develop --no-update-lock-file .#ci -c bash -c '
            cd services/updates
            bun run prepare:installers recheck ../../release-metadata/release.json \
              ../../release-metadata/current.json public/latest.json public/installers.json \
              ../../release-metadata/current-runs.json "$1"
          ' -- "${RELEASE_SHA}"

      - name: Deploy the updater and installer bundle
        if: steps.release.outputs.publish == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail

          [ -n "${CLOUDFLARE_ACCOUNT_ID}" ] || {
            echo "CLOUDFLARE_ACCOUNT_ID is not configured in updates-production." >&2
            exit 1
          }
          [ -n "${CLOUDFLARE_API_TOKEN}" ] || {
            echo "CLOUDFLARE_API_TOKEN is not configured in updates-production." >&2
            exit 1
          }

          nix develop --no-update-lock-file .#ci -c bash -lc \
            "cd services/updates && bun run deploy -- --strict \
              --tag 'release-${RELEASE_TAG#v}' \
              --message 'Publish ${RELEASE_TAG} from GitHub Release ${RELEASE_ID}'"

          domain_response="$(curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"hostname":"updates.trymaple.ai","service":"maple-updates","zone_name":"trymaple.ai"}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains")"
          jq -e '
            .success == true
            and .result.hostname == "updates.trymaple.ai"
            and .result.service == "maple-updates"
          ' <<<"${domain_response}" >/dev/null

      - name: Verify the public updater and download routes
        if: steps.release.outputs.publish == 'true'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if nix develop --no-update-lock-file .#ci -c bash -c '
              cd services/updates
              bun run prepare:installers verify-live https://updates.trymaple.ai public/installers.json public/latest.json
            '; then
              echo "Published ${RELEASE_TAG}: original Tauri metadata and all six installer redirects verified."
              exit 0
            fi
            echo "Waiting for the custom domain to serve the complete bundle (${attempt}/60)."
            sleep 10
          done
          echo "The public updater/download bundle did not match the deployed release." >&2
          exit 1
