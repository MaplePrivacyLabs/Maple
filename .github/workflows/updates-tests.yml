name: Updater Worker Tests

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/updates-tests.yml"
      - ".github/workflows/updates-publish.yml"
      - "services/updates/**"
      - "services/download-tracking/**"
      - "scripts/ci/_common.sh"
      - "scripts/ci/updates.sh"
      - "flake.nix"
      - "flake.lock"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/updates-tests.yml"
      - ".github/workflows/updates-publish.yml"
      - "services/updates/**"
      - "services/download-tracking/**"
      - "scripts/ci/_common.sh"
      - "scripts/ci/updates.sh"
      - "flake.nix"
      - "flake.lock"

jobs:
  test-updates-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""

      - name: Verify pinned Nix runtime
        run: bash scripts/ci/verify-nix-runtime.sh

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # was v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-updates-bun-${{ hashFiles('services/updates/bun.lock') }}

      - name: Run updater Worker checks
        run: nix develop --no-update-lock-file .#ci -c ./scripts/ci/updates.sh
