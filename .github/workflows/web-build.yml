name: Web App Build

# Release evidence: the attested master web artifact and its independent
# verification (.agents/skills/release-maple/scripts/ci_evidence.py). Pull
# requests build the same artifact in ci.yml's research-web lane. Never cancelled.
permissions:
  contents: read

on:
  push:
    branches: [ master ]
    paths:
      - ".github/workflows/web-build.yml"
      - "apps/maple-research/frontend/**"
      - "!apps/maple-research/frontend/src-tauri/**"
      - "sdk/src/**"
      - "!sdk/src/lib/test/**"
      - "sdk/package.json"
      - "sdk/bun.lock"
      - "sdk/bunfig.toml"
      - "sdk/tsconfig*.json"
      - "sdk/vite.config.ts"
      - "sdk/.npmrc"
      - "scripts/prepare-frontend-deps.sh"
      - "scripts/prepare-typescript-sdk.sh"
      - "scripts/ci/_common.sh"
      - "scripts/ci/web.sh"
      - "flake.nix"
      - "flake.lock"

jobs:
  build-web-master:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
        with:
          source-tag: v3.24.2
          github-token: ""
          # HTTP/2 stream resets from cache.nixos.org make Nix resume past
          # the end of a NAR (HTTP 416); HTTP/1.1 avoids the resets.
          extra-conf: http2 = false

      - name: Verify pinned Nix runtime
        run: bash scripts/ci/verify-nix-runtime.sh

      - name: Build web artifact
        run: nix develop --no-update-lock-file .#ci -c ./scripts/ci/web.sh
        env:
          MAPLE_WEB_ENVIRONMENT: release

      - name: Collect web checksums
        run: cat apps/maple-research/frontend/src-tauri/target/reproducibility/web-final.sha256

      - name: Attest web artifact
        # Keep uploads/verifiers running if GitHub token policy rejects artifact attestation.
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: apps/maple-research/frontend/src-tauri/target/reproducibility/web-final.sha256

      - name: Upload web artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maple-web
          path: |
            apps/maple-research/frontend/src-tauri/target/reproducibility/maple-web-dist.tar.gz
            apps/maple-research/frontend/src-tauri/target/reproducibility/web-final.sha256
          retention-days: 5

  verify-web-master-artifact:
    needs: build-web-master
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
        with:
          source-tag: v3.24.2
          github-token: ""
          # HTTP/2 stream resets from cache.nixos.org make Nix resume past
          # the end of a NAR (HTTP 416); HTTP/1.1 avoids the resets.
          extra-conf: http2 = false

      - name: Verify pinned Nix runtime
        run: bash scripts/ci/verify-nix-runtime.sh

      - name: Download web artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maple-web
          path: artifacts

      - name: Verify web artifact reproducibility proof
        run: nix develop --no-update-lock-file .#ci -c ./scripts/ci/verify-release-artifacts.sh artifacts web
