[workspace]
resolver = "2"
members = ["crates/maple-agent", "crates/maple-billing", "crates/maple-agent-updater", "crates/pi-ai", "crates/pi-agent-core", "crates/pi-coding-agent", "crates/store-bench", "app"]

[workspace.package]
edition = "2024"
version = "0.0.16"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
log = "0.4"
tokio = { version = "1.0", features = ["io-std", "io-util", "net", "process", "sync", "rt-multi-thread", "macros", "time"] }
tokio-util = { version = "0.7", features = ["codec", "compat", "io"] }
anyhow = "1.0"
async-trait = "0.1"
futures-util = "0.3"
once_cell = "1.18.0"
http = "1"
reqwest = { version = "0.13", features = ["stream"] }
# One SQLCipher build provides both unkeyed SQLite and opt-in password stores.
rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher", "functions", "hooks", "limits"] }
libsqlite3-sys = { version = "=0.38.2", features = ["bundled-sqlcipher-openssl4"] }
zeroize = { version = "1.9", features = ["alloc", "serde"] }
# Shared monorepo crates retain their independent package names and versions.
maple-sdk = { path = "../../sdk/rust" }
maple-proxy = { version = "0.4.0", path = "../../proxy" }

[profile.dev]
opt-level = 1

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# The embedded proxy requires `maple-sdk` from the registry; resolve it to the same
# in-tree source as the workspace dependency above (docs/sdk-publishing.md).
[patch.crates-io]
libsqlite3-sys = { git = "https://github.com/MaplePrivacyLabs/rusqlite.git", rev = "5f1c23d440773eb0121bc982ebc20a7450ff9ed3" }
maple-sdk = { path = "../../sdk/rust" }
