[workspace]
resolver = "2"
members = ["crates/maple-agent", "crates/maple-billing", "crates/maple-code-mode", "crates/maple-harness", "app"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1.0", features = ["io-std", "io-util", "net", "process", "sync", "rt-multi-thread", "macros", "time"] }
tokio-util = { version = "0.7", features = ["codec", "compat", "io"] }
anyhow = "1.0"
async-trait = "0.1"
futures-util = "0.3"
once_cell = "1.18.0"
http = "1"
reqwest = { version = "0.13", features = ["stream"] }
# Shared monorepo crates retain their independent package names and versions.
maple-sdk = { version = "3.6.2", path = "../../sdk/rust" }
maple-proxy = { version = "0.3.4", path = "../../proxy" }

[profile.dev]
opt-level = 1

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
