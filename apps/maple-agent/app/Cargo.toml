[package]
name = "maple-agent-app"
description = "Native Maple desktop app (gpui frontend over the maple-agent runtime)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "maple-agent"
path = "src/main.rs"

[features]
default = ["desktop", "acp", "proxy"]
# The gpui window. Without it the binary is headless and needs no display
# libraries; only `acp` and `proxy` modes remain.
desktop = [
    "dep:gpui",
    "dep:gpui-platform",
    "dep:image",
    "dep:unicode-segmentation",
    "dep:pulldown-cmark",
    "dep:cpal",
    "dep:rodio",
    "dep:notify",
    "dep:spellbook",
    "dep:wayland-client",
    "dep:tray-icon",
    "dep:zbus",
    "dep:objc",
    "dep:raw-window-handle",
]
# `maple-agent acp`: the Agent Client Protocol server on stdio.
acp = ["maple-agent/acp"]
# `maple-agent proxy`: the OpenAI-compatible HTTP endpoint.
proxy = ["dep:maple-proxy", "dep:axum", "dep:tower-http"]

[dependencies]
dirs = "6"
maple-agent = { path = "../crates/maple-agent", default-features = false }
maple-billing = { path = "../crates/maple-billing" }
maple-agent-updater = { path = "../crates/maple-agent-updater" }
# gpui is pinned to the Zed commit that gpui-libghostty (the embedded
# terminal Ben is preparing) builds against, so the two agree on one gpui
# once the terminal lands. crates.io 0.2.2 is older than this commit.
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", rev = "cc053a4a6fa2fd0e8793201ed9099466af1be0b1", optional = true }
# The application factory for that gpui revision; it lives one crate over.
# `font-kit` selects the native text system on macOS; without it this gpui
# revision draws no text at all.
gpui-platform = { package = "gpui_platform", version = "0.1.0", git = "https://github.com/zed-industries/zed", rev = "cc053a4a6fa2fd0e8793201ed9099466af1be0b1", features = ["font-kit", "wayland", "x11"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
base64 = "0.22"
httparse = "1"
rand = "0.8.6"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tokio-util = { workspace = true }
semver = "1"
log = { workspace = true }
env_logger = "0.11"
webbrowser = "1"
maple-sdk = { workspace = true }
uuid = { version = "1", features = ["v4"] }
unicode-segmentation = { version = "1", optional = true }
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
cpal = { version = "0.17", optional = true }
rodio = { version = "0.22", default-features = false, features = ["playback", "wav"], optional = true }
notify = { version = "8", optional = true }
spellbook = { version = "0.4", optional = true }
rusqlite = { workspace = true }
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
# Hidden password prompt for `maple-agent login`.
rpassword = "7"
hostname = "0.4"
maple-proxy = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json"] }
percent-encoding = "2"
url = "2.5"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
pake-cpace = { git = "https://github.com/1Password/cpace", rev = "7e2e42c7d359969f4356292c2bd2cf3ff6eeeecc" }
zeroize = { workspace = true }
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

# Used only to ask the compositor whether it draws window decorations; see
# `ui::decorations`. gpui cannot answer that question.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31", optional = true }
zbus = { version = "=5.19.0", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = { version = "=0.2.7", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_ErrorReporting", "Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
parking_lot = "0.12"
# The gpui test harness. Keep this out of [dependencies]: with test-support on,
# App::shutdown skips the on_app_quit futures and logs a timeout on every quit.
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", rev = "cc053a4a6fa2fd0e8793201ed9099466af1be0b1", features = ["test-support"] }

[build-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
