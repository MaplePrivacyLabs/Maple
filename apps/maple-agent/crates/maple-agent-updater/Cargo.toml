[package]
name = "maple-agent-updater"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs"] }
reqwest.workspace = true
futures-util.workspace = true
minisign-verify = "=0.2.4"
semver = "1"
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["parsing"] }
url = { version = "2", features = ["serde"] }
fs2 = "0.4"
tempfile = "3"
libc = "0.2"
thiserror = "2"
tar = "0.4"
flate2 = "1"
plist = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
base64 = "0.22"
blake2 = "0.10"
ed25519-dalek = "2"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.61.3", features = ["Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "=0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }
