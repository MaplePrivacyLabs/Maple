<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maple Work sign-in</title>
    <script>history.replaceState(null, "", "/auth/callback");</script>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(ellipse at 50% 0%, rgba(255, 151, 113, .12), transparent 65%), #f7f7f9;
        color: #30313a;
        font: 15px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: start center;
        padding: 24px;
        padding-top: clamp(24px, 20vh, 160px);
        padding-top: clamp(24px, 20dvh, 160px);
      }
      section {
        display: grid;
        align-content: start;
        gap: 24px;
        width: min(100%, 480px);
        padding: 40px;
        border: 1px solid rgba(32, 26, 24, .12);
        border-radius: 28px;
        background: #fff;
        box-shadow: 0 10px 30px -10px rgba(34, 26, 24, .18);
        text-align: center;
      }
      svg { margin: auto; }
      h1 { margin: 0; font-size: 28px; line-height: 1.25; font-weight: 600; }
      p { margin: 0; color: #5e5f6e; }
      @media (max-width: 480px) {
        section { padding: 32px 24px; }
        h1 { font-size: 24px; }
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="auth-title">
        <!-- Maple wordmark embedded from maple-marketing/public/brand; no asset requests. -->
        <svg width="124" height="24" viewBox="0 0 247.082 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Maple">
          <title>Maple</title>
          <path d="M0 41.2408V6.06562C0 0.652098 5.77774 -1.72459 10.1942 1.4443L26.9158 15.561L43.6375 1.4443C48.0567 -1.72459 53.8317 0.652098 53.8317 6.06562V41.2408C53.8317 44.9716 50.7962 47.9972 47.0534 47.9972H6.17796C2.16172 47.9972 0 45.6318 0 41.2408Z" fill="#171717"/>
          <path d="M58.7892 39.8362L79.685 3.36589C82.2553 -1.11494 86.5647 -1.12899 89.1435 3.36589L110.031 39.8362C112.77 44.6148 111.082 48 105.555 48H63.2649C57.7408 48 56.0526 44.6204 58.7892 39.8362Z" fill="#171717"/>
          <path d="M137.257 39.4064V41.2408C137.257 44.9716 134.221 47.9972 130.478 47.9972H121.49C117.745 47.9972 114.712 44.9716 114.712 41.2408V7.56014C114.712 3.82658 117.748 0.800986 121.493 0.800986H136.831C154.652 0.800986 160.965 8.65577 160.965 20.1318C160.965 31.6077 154.753 39.2827 137.259 39.4064H137.257Z" fill="#171717"/>
          <path d="M164.191 41.2408V7.56014C164.191 3.82658 167.227 0.800986 170.972 0.800986H179.96C183.706 0.800986 186.739 3.82658 186.739 7.55733V16.5331H195.743C199.489 16.5331 202.522 19.5587 202.522 23.2894V41.238C202.522 44.9688 199.486 47.9944 195.743 47.9944H170.972C167.227 47.9944 164.194 44.9688 164.194 41.238L164.191 41.2408Z" fill="#171717"/>
          <path d="M240.304 16.5331H230.6C233.943 17.4854 236.386 20.5532 236.386 24.1884C236.386 28.0259 233.669 31.2257 230.05 31.9842H240.321C244.712 31.9842 247.082 34.3412 247.082 38.7237V41.2549C247.082 45.6346 244.712 47.9972 240.315 47.9972H212.982C208.582 47.9972 206.215 45.6346 206.215 41.2549V7.5433C206.215 3.1608 208.582 0.800986 212.982 0.800986H240.315C244.712 0.800986 247.082 3.1608 247.082 7.5433V9.77668C247.082 13.5074 244.047 16.5302 240.306 16.5302L240.304 16.5331Z" fill="#171717"/>
        </svg>
        <h1 id="auth-title">{{title}}</h1>
        <p role="status">{{message}}</p>
      </section>
    </main>
  </body>
</html>
