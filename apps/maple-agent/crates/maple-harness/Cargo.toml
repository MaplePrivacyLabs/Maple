[package]
name = "maple-harness"
description = "GPUI-free semantic action, authority, audit, and keymap core for Maple"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
jsonschema = { version = "0.49.9", default-features = false }
schemars = { version = "1", features = ["derive", "uuid1"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2.0"
tokio-util = { workspace = true }
uuid = { version = "1.25", features = ["serde", "v4"] }
