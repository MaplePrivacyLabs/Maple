[package]
name = "pi-ai"
description = "Portable model contracts and streaming primitives ported from Pi"
edition.workspace = true
version.workspace = true
license.workspace = true
autotests = false

[features]
default = []
faux = []
test-internals = []

[dependencies]
futures-util = "0.3"
getrandom = "0.4"
indexmap = { version = "2", features = ["serde"] }
jsonschema = { version = "=0.55.1", default-features = false }
regex = "1"
regress = { version = "=0.12.0", features = ["utf16"] }
ryu-js = "=1.0.3"
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
tokio = { version = "1.0", features = ["time", "sync", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
unicode-normalization = "0.1.25"
url = "2.5.8"

[dev-dependencies]
pi-ai = { path = ".", features = ["faux", "test-internals"] }
pi-testkit = { path = "../pi-testkit" }

[[test]]
name = "upstream"
path = "tests/main.rs"
