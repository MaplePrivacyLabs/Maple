[package]
name = "pi-coding-agent"
description = "Sessions, compaction, resources, extensions and the agent session, after Pi's coding-agent core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
pi-ai = { path = "../pi-ai", default-features = false }
pi-agent-core = { path = "../pi-agent-core" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
tokio = { workspace = true, features = ["fs"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
base64 = "0.22"
globset = "0.4"
ignore = "0.4"
image ={ version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
similar = "2"
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
