[[deviation]]
scenario = "functions/agent.clearedModel"
jsonPath = "$.providerInvocations"
kind = "language"
rule = "agent-cleared-model-typed-provider-boundary"
reason = "After explicitly clearing a low-level Agent model, Pi invokes streamFn with undefined when no getApiKey callback exists. The Rust provider contract requires a Model and omits this invalid call. The paired predicate requires exactly one source invocation and zero Rust invocations only for without-api-key; all other events, history, final TypeError, cleanup, API-key callback count and missing errorMessage compare unchanged. With getApiKey the complete record is identical. The normal session no-model guard remains exact."
approvedIn = "Owner explicitly answered Approve and document boundary in the task conversation on 2026-10-08; recorded in https://github.com/MaplePrivacyLabs/Maple/pull/1102."
