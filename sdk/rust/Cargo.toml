[package]
name = "maple-sdk"
version = "5.0.0"
edition = "2021"
authors = ["Maple Privacy Labs"]
description = "Maple Rust SDK for secure AI APIs, encrypted sessions, and Nitro attestation"
license = "MIT"
homepage = "https://trymaple.ai"
repository = "https://github.com/MaplePrivacyLabs/Maple"
documentation = "https://docs.rs/maple-sdk"
keywords = ["maple", "ai", "encryption", "nitro", "attestation"]
categories = ["cryptography", "api-bindings", "web-programming"]

[dependencies]
# HTTP and async runtime
reqwest = { version = "0.12.23", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "charset", "system-proxy"] }
http = "1.1"
tokio = { version = "1.41", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"
percent-encoding = "2.3"

# Cryptography
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets", "zeroize"] }
hkdf = "0.12"
p256 = { version = "0.14", default-features = false, features = ["ecdh", "pkcs8", "getrandom", "std"] }
# Enforce the RUSTSEC-2026-0387 fix for downstream builds without this lockfile.
crypto-bigint = { version = "0.7.6", default-features = false }
# X25519 retains its existing RNG traits independently of P-256's newer API.
rand_core = { version = "0.6.4", features = ["getrandom"] }
sha2 = "0.10"
base64 = "0.22"
ring = "0.17"  # For certificate validation
hex = "0.4"  # For debug output
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }

# Enclave release approval and public Sigstore evidence. Upstream sigstore-verify
# cannot yet verify P-384 keys logged in Rekor v2 or require a checkpoint from
# the entry's own log, so it comes from Maple's published fork under a new
# package name; its library name, and so every import, is unchanged. The fork
# pins the unmodified upstream crates to exactly this release, so these must
# move together.
sigstore-types = { version = "=0.17.0", default-features = false }
sigstore-trust-root = { version = "=0.17.0", default-features = false, features = ["tuf", "rustls", "aws-lc-rs"] }
sigstore-verify = { package = "maple-sigstore-verify", version = "=0.17.0-maple.1", default-features = false, features = ["rustls", "aws-lc-rs"] }

# X.509 and certificate handling
x509-parser = "0.16"
yasna = "0.5"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }

# SSE support for streaming
eventsource-stream = "0.2"
async-stream = "0.3"
futures = "0.3"
pin-project = "1.1"
bytes = "1.8"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
pretty_assertions = "1.4"
tracing-subscriber = "0.3"
dotenvy = "0.15.7"

[features]
default = []
mock-attestation = []  # Expose mock document helpers; client bypass remains exact-loopback only
