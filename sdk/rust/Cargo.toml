[package]
name = "maple-sdk"
version = "4.1.0"
edition = "2021"
authors = ["Maple Privacy Labs"]
description = "Maple Rust SDK for secure AI APIs, encrypted sessions, and Nitro attestation"
license = "MIT"
homepage = "https://trymaple.ai"
repository = "https://github.com/MaplePrivacyLabs/Maple"
documentation = "https://docs.rs/maple-sdk"
keywords = ["maple", "ai", "encryption", "nitro", "attestation"]
categories = ["cryptography", "api-bindings", "web-programming"]

[dependencies]
# HTTP and async runtime
reqwest = { version = "0.12.23", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "charset", "system-proxy"] }
http = "1.1"
tokio = { version = "1.41", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"
percent-encoding = "2.3"

# Cryptography
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets", "zeroize"] }
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh", "pkcs8"] }
sha2 = "0.10"
base64 = "0.22"
ring = "0.17"  # For certificate validation
hex = "0.4"  # For debug output
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }

# X.509 and certificate handling
x509-parser = "0.16"
yasna = "0.5"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }

# SSE support for streaming
eventsource-stream = "0.2"
async-stream = "0.3"
futures = "0.3"
pin-project = "1.1"
bytes = "1.8"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
pretty_assertions = "1.4"
tracing-subscriber = "0.3"
dotenvy = "0.15.7"

[features]
default = []
mock-attestation = []  # Expose mock document helpers; client bypass remains exact-loopback only
