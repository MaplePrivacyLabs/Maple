# Service-owned local development contract. This file contains no secret values.
[project]
name = "opensecret-local-dev"
revision = "1.0"

# Configure opensecret_local in your user-level SecretSpec provider aliases.
[profiles.default]
CONTINUUM_API_KEY = { description = "Local Continuum inference proxy", required = true, providers = ["opensecret_local"], ref = { item = "continuum_api_key" } }
TINFOIL_API_KEY = { description = "OpenSecret direct Tinfoil inference", required = true, providers = ["opensecret_local"], ref = { item = "tinfoil_api_key" } }
KAGI_API_KEY = { description = "OpenSecret Kagi web tools", required = true, providers = ["opensecret_local"], ref = { item = "kagi_api_key" } }

[scopes.local]
secrets = ["CONTINUUM_API_KEY", "TINFOIL_API_KEY", "KAGI_API_KEY"]

[scopes.continuum]
secrets = ["CONTINUUM_API_KEY"]

[scopes.backend]
secrets = ["TINFOIL_API_KEY", "KAGI_API_KEY"]
