# Service-owned local development contract. This file contains no secret values.
[project]
name = "opensecret-local-dev"
revision = "1.0"

# The opensecret-local-dev BWS project. The token comes from the machine's one
# shared keyring item, the same item every Maple/OpenSecret manifest reads, so a
# machine that has logged in once needs nothing further here; BWS project grants
# decide what that machine may read. Headless VMs and containers export
# BWS_ACCESS_TOKEN and SECRETSPEC_PROVIDER=opensecret_local_headless instead.
[providers]
opensecret_local = { uri = "bws://9a8c5b99-b00c-4403-beb1-b4c400050810", credentials = { access_token = { provider = "keyring", ref = { item = "secretspec/opensecret-dev-observability/_provider/access_token" } } } }
opensecret_local_headless = "bws://9a8c5b99-b00c-4403-beb1-b4c400050810"

[profiles.default]
CONTINUUM_API_KEY = { description = "Local Continuum inference proxy", required = true, providers = ["opensecret_local"], ref = { item = "continuum_api_key" } }
TINFOIL_API_KEY = { description = "OpenSecret direct Tinfoil inference", required = true, providers = ["opensecret_local"], ref = { item = "tinfoil_api_key" } }
KAGI_API_KEY = { description = "OpenSecret Kagi web tools", required = true, providers = ["opensecret_local"], ref = { item = "kagi_api_key" } }

[scopes.local]
secrets = ["CONTINUUM_API_KEY", "TINFOIL_API_KEY", "KAGI_API_KEY"]

[scopes.continuum]
secrets = ["CONTINUUM_API_KEY"]

[scopes.backend]
secrets = ["TINFOIL_API_KEY", "KAGI_API_KEY"]
