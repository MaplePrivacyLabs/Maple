# Service-owned local development contract. This file contains no secret values.
[project]
name = "opensecret-local-dev"
revision = "1.0"

[providers.local_bws]
# opensecret-local-dev BWS project; the ID is stable across project renames.
uri = "bws://9a8c5b99-b00c-4403-beb1-b4c400050810"
# Reuse the existing machine login without copying the token or sending it to services.
credentials = { access_token = { provider = "keyring", ref = { item = "secretspec/opensecret-dev-observability/_provider/access_token" } } }

[profiles.default]
CONTINUUM_API_KEY = { description = "Local Continuum inference proxy", required = true, providers = ["local_bws"], ref = { item = "continuum_api_key" } }
TINFOIL_API_KEY = { description = "OpenSecret direct Tinfoil inference", required = true, providers = ["local_bws"], ref = { item = "tinfoil_api_key" } }
KAGI_API_KEY = { description = "OpenSecret Kagi web tools", required = true, providers = ["local_bws"], ref = { item = "kagi_api_key" } }

[scopes.local]
secrets = ["CONTINUUM_API_KEY", "TINFOIL_API_KEY", "KAGI_API_KEY"]

[scopes.continuum]
secrets = ["CONTINUUM_API_KEY"]

[scopes.backend]
secrets = ["TINFOIL_API_KEY", "KAGI_API_KEY"]
